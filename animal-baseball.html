/* Build a 9-man roster with a batting order and fielding positions. */
function makeTeam(def) {
  const names = NAME_POOL[def.animal].slice();
  const order = ['CF', 'SS', 'RF', '1B', 'LF', '3B', 'C', '2B', 'P'];
  const roster = order.map((posK, i) => {
    const v = (s, spread) => clamp(s / 5 + rnd(-spread, spread), 0.12, 1.0);
    return {
      name: names[i], no: i + 1, pos: posK,
      look: { animal: def.animal, uni: def.uni, trim: def.trim, cap: def.cap },
      power: v(def.pow, 0.14), contact: v(def.con, 0.14), speed: v(def.spd, 0.12), defense: v(def.def, 0.12),
      arm: (def.arm || 3) / 5,
      ab: 0, h: 0, hr: 0, rbi: 0, k: 0, bb: 0, hbp: 0,
    };
  });
  // the pitcher bats ninth but is the best arm
  roster[8].arm = clamp((def.arm || 3) / 5 + 0.18, 0, 1);
  roster[8].power = clamp(roster[8].power - 0.22, 0.1, 1);
  roster[8].contact = clamp(roster[8].contact - 0.18, 0.1, 1);
  return { def, name: def.name, roster, animal: def.animal, uni: def.uni, trim: def.trim, cap: def.cap };
}
/* ============================================================
   40-game.js — the rules: counts, outs, innings, batted balls,
   fielding, base running, and the end of the game.
   ============================================================ */
'use strict';

const ZX = 0.30, ZY0 = 0.50, ZY1 = 1.26;      // strike zone
const SWING_LAG = 0.09;                        // press -> barrel in the zone
const TIME_WIN = 0.115;                        // usable timing window (s)
const MEET_WIN = 0.46;                         // usable aim window (m)
const BAT_X = 0.95, BAT_Z = 0.25;              // right-handed batter's box (+x = 3B side)

const PITCHES = [
  { k: 'straight', nm: 'ストレート', en: 'FASTBALL', spd: 33.0, bx: 0,     by: 0,     pw: 2.0 },
  { k: 'curve',    nm: 'カーブ',     en: 'CURVE',    spd: 24.5, bx: -0.20, by: -0.55, pw: 2.0 },
  { k: 'slider',   nm: 'スライダー', en: 'SLIDER',   spd: 29.0, bx: -0.44, by: -0.18, pw: 2.6 },
  { k: 'fork',     nm: 'フォーク',   en: 'SPLITTER', spd: 27.5, bx: 0,     by: -0.80, pw: 3.4 },
  { k: 'shoot',    nm: 'シュート',   en: 'SHOOT',    spd: 30.0, bx: 0.38,  by: -0.12, pw: 2.2 },
];

function gauss(sd) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * sd;
}

const G = {
  active: false, over: false,
  st: null, stations: [], away: null, home: null, userSide: 0,
  inning: 1, half: 0, outs: 0, balls: 0, strikes: 0,
  bases: [null, null, null], score: [0, 0], lines: [[], []], order: [0, 0],
  hits: [0, 0], errs: [0, 0], lob: [0, 0], inningRuns: 0,
  phase: 'idle', pt: 0, phaseLen: 0,
  pitch: null, ball: { x: 0, y: 0, z: 0, vis: false }, trail: [],
  reticle: { x: 0, y: 0.88 }, swingT: -1, contactAt: -1, decided: null,
  batSwingT: -1, bunting: false, pitchType: 0,
  fielders: [], movers: [], flight: null, chase: null,
  camMode: 'bat', lastText: '', mode: 'cpu', paused: false, playScript: null, traffic: null, carStall: 0,
  firstPitch: false, ballBoost: 1,
  innings: 6, hbpT: 0,
};

const batTeam = () => (G.half === 0 ? G.away : G.home);
const fldTeam = () => (G.half === 0 ? G.home : G.away);
const userBatting = () => (G.half === 0 ? 0 : 1) === G.userSide;
/* who is at the controls right now */
const humanBats = () => (G.mode === 'vs' ? true : G.mode === 'auto' ? false : userBatting());
const humanPitches = () => (G.mode === 'vs' ? true : G.mode === 'auto' ? false : !userBatting());
/* 1P is always the away side */
const battingPlayer = () => (G.half === 0 ? '1P' : '2P');
const pitchingPlayer = () => (G.half === 0 ? '2P' : '1P');
const curBatter = () => batTeam().roster[G.order[G.half]];
const curPitcher = () => fldTeam().roster[8];
const basePt = (i) => (i < 0 || i >= 3 ? HOME_POS : BASE_POS[i]);

/* ============================================================
   setup
   ============================================================ */
function startGame(stadiumId, awayTeamId, homeTeamId) {
  const st = stadiumById(stadiumId);
  G.st = st;
  G.stations = stationsFor(st);
  G.scene = st.build();
  const others = TEAMS.filter((t) => t.id !== awayTeamId);
  G.away = makeTeam(teamById(awayTeamId));
  G.home = makeTeam(homeTeamId ? teamById(homeTeamId) : pick(others));
  G.userSide = 0;
  G.inning = 1; G.half = 0; G.outs = 0; G.balls = 0; G.strikes = 0;
  G.bases = [null, null, null];
  G.score = [0, 0]; G.lines = [[], []]; G.order = [0, 0];
  G.hits = [0, 0]; G.errs = [0, 0]; G.lob = [0, 0]; G.inningRuns = 0;
  G.over = false; G.active = true; G.paused = false; G.movers = []; G.flight = null; G.playScript = null;
  G.firstPitch = true;
  // start already looking down the barrel instead of swinging in from the menu
  CAM.ex = 0.55; CAM.ey = 4.6; CAM.ez = -9.0; CAM.tx = 0; CAM.ty = 0.4; CAM.tz = 7.0; CAM.fov = 40;
  CAM.wx = CAM.ex; CAM.wy = CAM.ey; CAM.wz = CAM.ez;
  G.fielders = G.stations.map((s) => ({ st: s, x: s.x, z: s.z, tx: s.x, tz: s.z, ry: Math.PI, run: 0, hold: false, down: 0, dvz: 0, dodge: 0 }));
  G.traffic = makeTraffic(st);
  uiTeams();
  clearLog();
  logLine(`${G.st.name}での試合です。${G.away.name} 対 ${G.home.name}。`, true);
  logLine(`ルール：${G.st.quirk}`);
  nextBatter();
}

function setPhase(p, len) { G.phase = p; G.pt = 0; G.phaseLen = len || 0; }

function nextBatter() {
  G.balls = 0; G.strikes = 0;
  G.swingT = -1; G.contactAt = -1; G.decided = null; G.batSwingT = -1; G.bunting = false;
  G.reticle.x = 0; G.reticle.y = 0.88;
  G.ball.vis = false; G.trail.length = 0;
  G.camMode = 'bat';
  placeFielders();
  uiScore();                       // the pips belong to this batter, not the last
  uiBatter();
  setPhase('ready', G.firstPitch ? 3.0 : 1.5);
}

function placeFielders() {
  for (const f of G.fielders) { f.tx = f.st.x; f.tz = f.st.z; f.hold = false; }
}

/* traffic keeps rolling whatever the game is doing */
function updateTraffic(dt) {
  if (!G.traffic) return;
  stepTraffic(G.traffic, dt);
  for (const f of G.fielders) {
    if (f.down > 0) { f.down -= dt; f.z += f.dvz * dt; f.dvz *= 0.90; continue; }
    if (f.dodge > 0) { f.dodge -= dt; continue; }   // just got out of the way
    if (f.scripted) continue;            // he is on the play; leave him to it
    for (const c of G.traffic) {
      if (carHits(c, f.x, 0.6, f.z, 0.30)) {
        if (!chance(c.walk ? 0.20 : 0.13)) { f.dodge = 1.3; break; }  // he skips clear
        f.down = c.walk ? 1.4 : 2.0;
        f.dvz = Math.sign(c.vz) * (c.walk ? 2.0 : 6.0);
        Snd.crash();
        logLine(c.walk ? `${f.st.sn}が買い物客とぶつかって転倒！`
                       : `${f.st.sn}が車にはねられた！`, true);
        break;
      }
    }
  }
}

/* A runner flattened between the bags never gets there: he is out, and any run
   he was in the middle of scoring comes back off the board. */
function runOverRunner(m, walk) {
  if (m.retired) return;
  m.retired = true;
  for (let i = 0; i < 3; i++) if (G.bases[i] === m.p) G.bases[i] = null;
  if (m.scored) {
    G.score[G.half] = Math.max(0, G.score[G.half] - 1);
    G.inningRuns = Math.max(0, G.inningRuns - 1);
    if (m.rbiOwner) m.rbiOwner.rbi = Math.max(0, m.rbiOwner.rbi - 1);
    m.scored = false;
  }
  if (G.outs < 3) G.outs++;
  banner(walk ? `${m.p.name} 買い物客と衝突\nアウト！` : `${m.p.name} 車にはねられ\nアウト！`, true);
  logLine(walk ? `${m.p.name}が買い物客とぶつかってアウト！` : `${m.p.name}が車にはねられてアウト！`, true);
  uiScore();
}

/* ============================================================
   pitching
   ============================================================ */
function cpuPitchChoice() {
  const p = curPitcher();
  const behind = G.balls >= 2 && G.strikes < 2;
  const ahead = G.strikes === 2 || (G.strikes > G.balls);
  let ti = 0;
  if (behind) ti = chance(0.7) ? 0 : rint(1, 4);
  else if (ahead) ti = chance(0.72) ? rint(1, 4) : 0;
  else ti = rint(0, 4);
  // aim: ahead in the count -> chase pitch just off the plate
  const wide = ahead && chance(0.55);
  const ax = clamp(gauss(wide ? 0.44 : 0.36) + (wide ? (chance(0.5) ? 0.34 : -0.34) : 0), -0.85, 0.85);
  const ay = clamp(0.88 + gauss(wide ? 0.40 : 0.34) + (wide ? -0.18 : 0), 0.20, 1.66);
  const acc = 0.62 + p.arm * 0.38;
  let fx = ax + gauss((1 - acc) * 0.30), fy = ay + gauss((1 - acc) * 0.28);
  if (chance(0.10)) { fx += gauss(0.40); fy += gauss(0.38); }   // he misses his spot
  return { ti, ax: fx, ay: fy };
}

function throwPitch(ti, ax, ay) {
  const p = curPitcher();
  const P = PITCHES[ti];
  // no two pitches come out quite the same
  const spd = P.spd * (0.90 + p.arm * 0.16) * (1 + gauss(0.040));
  const T = 18.15 / spd;
  const slip = (1 - p.arm) * 0.11;             // even his own aim drifts a little
  const bx = P.bx * (1 + gauss(0.20)), by = P.by * (1 + gauss(0.20));
  const arrive = { x: clamp(ax + gauss(slip), -0.95, 0.95),
                   y: clamp(ay + gauss(slip), 0.22, 1.68) };
  const pf = G.fielders[0];
  G.pitch = {
    P, T, t: 0, ti, bx, by,
    x0: (pf ? pf.x : 0) + 0.46, y0: 1.92, z0: (pf ? pf.z : MOUND_POS[1]) - 0.16,
    tx: arrive.x - bx, ty: arrive.y - by,
    ax: arrive.x, ay: arrive.y,
    inZone: Math.abs(arrive.x) <= ZX + 0.05 && arrive.y >= ZY0 - 0.05 && arrive.y <= ZY1 + 0.05,
    // way inside and at body height: it is going to hit him unless he spins away
    hbp: arrive.x > 0.80 && arrive.y > 0.18 && arrive.y < 1.58 && chance(0.12),
  };
  G.swingT = -1; G.contactAt = -1; G.decided = null; G.batSwingT = -1;
  G.ball.vis = true; G.trail.length = 0; G.firstPitch = false;
  // in two-player games the hitter re-aims from scratch each pitch
  if (G.mode === 'vs') { G.reticle.x = 0; G.reticle.y = 0.88; }
  if (!humanBats()) cpuBatterDecide();
  Snd.blip();
  setPhase('pitch');
  if (G.mode === 'vs') uiHint();   // controls hand over to the hitter
}

function pitchPos(pc, t) {
  const u = clamp(t / pc.T, 0, 1.6);
  const k = Math.pow(Math.min(u, 1), pc.P.pw);
  return {
    x: lerp(pc.x0, pc.tx, u) + pc.bx * k,
    y: lerp(pc.y0, pc.ty, u) + pc.by * k - (u > 1 ? (u - 1) * 0.5 : 0),
    z: lerp(pc.z0, 0.15, u),
  };
}

function cpuBatterDecide() {
  const b = curBatter(), pc = G.pitch;
  const eye = 0.34 + b.contact * 0.5;
  let sw;
  if (pc.inZone) sw = chance(0.42 + eye * 0.32 + G.strikes * 0.09);
  else {
    const close = Math.abs(pc.ax) < ZX + 0.28 && pc.ay > ZY0 - 0.28 && pc.ay < ZY1 + 0.28;
    sw = chance((close ? 0.34 : 0.09) + (G.strikes === 2 ? (close ? 0.40 : 0.14) : 0) - eye * 0.12);
  }
  if (!sw) return;
  const jitter = 1.75 - b.contact * 0.65;
  G.swingT = pc.T - SWING_LAG + gauss(0.062 * jitter);
  G.cpuAim = {
    x: pc.ax + gauss(0.22 * jitter),
    y: pc.ay + gauss(0.20 * jitter),
  };
}

/* ============================================================
   the swing
   ============================================================ */
function playerSwing(bunt) {
  if (G.phase !== 'pitch' || G.swingT >= 0 || !humanBats()) return;
  G.swingT = G.pitch.t;
  G.bunting = !!bunt;
  G.batSwingT = 0;
  judgeSwing();
}

function judgeSwing() {
  const pc = G.pitch, b = curBatter();
  const contactT = G.swingT + SWING_LAG;
  const dt = contactT - pc.T;
  const aim = humanBats() ? G.reticle : G.cpuAim;
  const err = Math.hypot(pc.ax - aim.x, (pc.ay - aim.y) * 1.05);
  const tw = TIME_WIN * (0.80 + b.contact * 0.42) * (G.bunting ? 1.7 : 1);
  const mw = MEET_WIN * (0.80 + b.contact * 0.42) * (G.bunting ? 1.5 : 1);
  if (Math.abs(dt) > tw || err > mw) { G.decided = { miss: true }; return; }
  const qT = 1 - Math.abs(dt) / tw, qM = 1 - err / mw;
  const q = clamp(qT * 0.56 + qM * 0.44, 0, 1);
  G.decided = { miss: false, q, dt, err, dy: pc.ay - aim.y };
  G.contactAt = Math.max(contactT, pc.T * 0.97);
}

/* ============================================================
   ball flight simulation
   ============================================================ */
/* a snapshot of the traffic, advanced with the ball so the carom is part of
   the same simulation the ruling is read from */
function carsSnapshot() {
  return (G.traffic || []).map((c) => ({ x: c.x, z0: c.z, vz: c.vz, hw: c.hw, hh: c.hh, hl: c.hl }));
}

function simFlight(v0, laDeg, dirDeg, st) {
  const la = laDeg * DEG, dir = dirDeg * DEG;
  let x = BAT_X - 0.80, y = 1.05, z = BAT_Z + 0.17;
  const vh = v0 * Math.cos(la);
  let vx = vh * Math.sin(dir), vz = vh * Math.cos(dir), vy = v0 * Math.sin(la);
  const path = [];
  const cars = carsSnapshot();
  let carHit = 0;
  let t = 0, hr = false, ceilHit = false, apex = y, hang = 0, bounced = 0, groundIdx = -1;
  const dt = 1 / 90, drag = 0.0019;
  const wallTest = () => {
    const d = Math.hypot(x, z), a = angOf(x, z);
    if (Math.abs(a) > 50) return 0;
    const fd = fenceAt(st, a);
    if (d >= fd) return y > st.fenceH ? 2 : 1;
    return 0;
  };
  while (t < 11) {
    const sp = Math.hypot(vx, vy, vz);
    const k = drag * sp;
    vx -= vx * k * dt; vz -= vz * k * dt;
    vy -= (st.gravity + vy * k) * dt;
    x += vx * dt; y += vy * dt; z += vz * dt; t += dt;
    if (y > apex) apex = y;
    if (st.ceiling && y > st.ceiling - BALL_R && !ceilHit) {
      ceilHit = true; y = st.ceiling - BALL_R; vy = -Math.abs(vy) * 0.32; vx *= 0.6; vz *= 0.6;
    }
    if (y <= BALL_R) {
      if (!hang) hang = t;
      if (groundIdx < 0) groundIdx = path.length;
      y = BALL_R;
      if (bounced < 6 && Math.abs(vy) > 0.9) { vy = -vy * 0.36; vx *= 0.82; vz *= 0.82; bounced++; }
      else { vy = 0; vx -= vx * 1.15 * dt; vz -= vz * 1.15 * dt; }  // rolling friction
      if (Math.hypot(vx, vz) < 0.6) { path.push({ x, y, z, t }); break; }
    }
    if (carHit < 3) {
      for (const c of cars) {
        const cz = c.z0 + c.vz * t;
        if (Math.abs(x - c.x) >= c.hw + BALL_R || Math.abs(z - cz) >= c.hl + BALL_R || y >= c.hh + BALL_R) continue;
        const px = (c.hw + BALL_R) - Math.abs(x - c.x);
        const pz = (c.hl + BALL_R) - Math.abs(z - cz);
        const py = (c.hh + BALL_R) - y;
        if (py <= px && py <= pz) {                       // off the roof
          y = c.hh + BALL_R; vy = Math.abs(vy) * 0.45 + 2.2; vz += c.vz * 0.25;
        } else if (px < pz) {                             // off the flank
          const s2 = Math.sign(x - c.x) || 1;
          x = c.x + s2 * (c.hw + BALL_R);
          vx = s2 * (Math.abs(vx) * 0.55 + 3.5); vz += c.vz * 0.35; vy = Math.abs(vy) * 0.4 + 1.2;
        } else {                                          // off the nose or tail
          const s2 = Math.sign(z - cz) || 1;
          z = cz + s2 * (c.hl + BALL_R);
          vz = s2 * (Math.abs(vz) * 0.5 + 2.0) + c.vz * 0.55; vy = Math.abs(vy) * 0.4 + 1.5;
        }
        carHit++; groundIdx = groundIdx < 0 ? -1 : groundIdx;
        break;
      }
    }
    const w = st.fenceH > 0 ? wallTest() : 0;
    if (w === 2) { hr = true; path.push({ x, y, z, t }); break; }
    if (w === 1) { vx *= -0.32; vz *= -0.32; x += vx * dt * 2; z += vz * dt * 2; }
    path.push({ x, y, z, t });
  }
  if (!hang) hang = t;
  // where it first comes down — that is what fielders play
  let land = { x, z }, landT = t;
  for (const p of path) if (p.y <= BALL_R + 0.05) { land = { x: p.x, z: p.z }; landT = p.t; break; }
  const a = angOf(land.x, land.z);
  return {
    path, hang: landT, apex, hr, ceilHit, la: laDeg, dir: dirDeg, v0,
    groundIdx: groundIdx < 0 ? path.length : groundIdx, carHit,
    land, dist: Math.hypot(land.x, land.z), ang: a,
    finalDist: Math.hypot(x, z), finalX: x, finalZ: z, total: t,
    foul: Math.abs(a) > 45,
  };
}

/* ============================================================
   turning a batted ball into a baseball outcome
   ============================================================ */
const fielderOf = (team, k) => team.roster.find((r) => r.pos === k) || team.roster[0];

/* The first moment a fielder starting at (sx,sz) can put a glove on the ball.
   Only points below jumping height count, and he needs time to get there. */
function interceptOn(fl, sx, sz, spd) {
  const path = fl.path;
  for (let i = 0; i < path.length; i++) {
    const q = path[i];
    if (q.y > 2.6) continue;                       // still over his head
    const reach = 0.9 + spd * Math.max(0, q.t - 0.35) * 0.88;
    if (Math.hypot(q.x - sx, q.z - sz) <= reach)
      return { i, t: q.t, p: q, air: i < fl.groundIdx };
  }
  const i = path.length - 1;
  return { i, t: path[i].t, p: path[i], air: false, late: true };
}

/* transfer + throw, with a cut-off man on anything long */
function throwTime(from, tx, tz, arm) {
  const d = Math.hypot(from.x - tx, from.z - tz);
  return 0.55 + d / (27 + (arm || 0.6) * 13) + (d > 42 ? 1.05 : 0);
}

const LEAD_OFF = 2.6;              // how far a runner edges off the bag

/* seconds from contact for a runner to reach base n (1 = first) */
function baseTime(p, n) {
  const first = 27.43 / (5.6 + p.speed * 1.7);   // 4.9s slow .. 3.8s quick
  const rest = 27.43 / (7.6 + p.speed * 2.2);
  return first + (n - 1) * rest + (n > 1 ? 0.25 : 0);
}

/* which fielder covers a bag for the throw; if he is the one who fielded the
   ball, the usual back-up takes it instead */
const BACKUP = { '1B': 'P', '2B': 'SS', '3B': 'P', C: 'P', SS: '2B' };
function coverFor(tx, tz, busy) {
  const near = (b) => dist2(tx, tz, b[0], b[1]) < 1.5;
  const want = near(BASE_POS[0]) ? '1B' : near(BASE_POS[1]) ? '2B'
    : near(BASE_POS[2]) ? '3B'
    : dist2(tx, tz, HOME_POS[0], HOME_POS[1]) < 2.5 ? 'C' : null;
  if (!want) {
    // not a bag — a lob back to the mound, a cut-off. The nearest infielder
    // takes it; the catcher never leaves the plate to chase a throw.
    let bi = -1, bd = 1e9;
    for (let i = 0; i < G.stations.length; i++) {
      const s = G.stations[i];
      if (s.k === 'C' || !s.infield || i === busy) continue;
      const d = dist2(tx, tz, s.x, s.z);
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  }
  let i = G.stations.findIndex((s) => s.k === want);
  if (i === busy && BACKUP[want]) i = G.stations.findIndex((s) => s.k === BACKUP[want]);
  return i;
}
const stationIdx = (k) => G.stations.findIndex((s) => s.k === k);

/* the ball squirts out of the glove and he has to go and get it */
const FUMBLE_T = 0.66;
function fumble(play, P) {
  const a = rnd(0, Math.PI * 2), d = rnd(2.2, 3.6);
  play.fumble = 1;
  play.fumbleTo = [P.x + Math.cos(a) * d, P.z + Math.sin(a) * d];
}

function fieldBall(fl) {
  const st = G.st, bat = curBatter(), def = fldTeam();

  if (fl.foul) return { kind: 'foul', text: 'ファウル' };
  if (fl.hr) {
    const far = fl.finalDist > fenceAt(st, fl.ang) * 1.22;
    return { kind: 'hr', bases: 4, big: true,
      text: far ? 'ホームラン！\n特大の一発だ' : 'ホームラン！' };
  }
  if (fl.ceilHit && st.ceiling && fl.dist >= fenceAt(st, fl.ang) * 0.94)
    return { kind: 'ground_rule', bases: 2, hit: true, text: '天井に当たった！\nエンタイトルツーベース' };
  if (st.fenceH === 0 && fl.dist >= fenceAt(st, fl.ang) && fl.la >= 14)
    return { kind: 'hr', bases: 4, big: true, text: 'ホームラン！\n川まで届いた' };

  /* who actually gets to it first */
  let best = null;
  const rest = fl.path[fl.path.length - 1];
  for (let i = 0; i < G.stations.length; i++) {
    if (G.fielders[i] && G.fielders[i].down > 0) continue;   // flattened by a car
    const s = G.stations[i], pl = fielderOf(def, s.k);
    // a pitcher fields comebackers and bunts, not gaps
    const spd = 6.0 * st.fielderSpeed * (0.86 + pl.defense * 0.28) * (s.k === 'P' ? 0.72 : 1);
    const fx = G.fielders[i] ? G.fielders[i].x : s.x;
    const fz = G.fielders[i] ? G.fielders[i].z : s.z;
    const it = interceptOn(fl, fx, fz, spd);
    // if nobody could cut it off, whoever is nearest where it stops goes and
    // gets it — otherwise the tie always fell to the pitcher
    const key = it.late ? 1e5 + dist2(fx, fz, rest.x, rest.z) : it.t;
    if (!best || key < best.key) best = { i, s, pl, spd, it, key };
  }
  let downNote = '';
  {
    let nd = null;
    for (let i = 0; i < G.stations.length; i++) {
      const st2 = G.stations[i], d = dist2(st2.x, st2.z, fl.land.x, fl.land.z);
      if (!nd || d < nd.d) nd = { i, d, sn: st2.sn };
    }
    if (nd && G.fielders[nd.i] && G.fielders[nd.i].down > 0 && nd.d < 22)
      downNote = `${nd.sn}が倒れている！\n`;
  }
  if (!best) {   // everybody is down — the ball just sits there
    const q = fl.path[fl.path.length - 1];
    return { kind: 'hit', bases: 3, hit: true, text: '誰も追いつけない！\nスリーベース',
             play: { fidx: 0, cutIdx: fl.path.length - 1, cutT: q.t,
                     pt: { x: q.x, y: q.y, z: q.z }, air: false, coverIdx: -1 } };
  }
  const P = best.it.p;
  const errP = clamp((1 - best.pl.defense) * 0.05
    + (st.id === 'market' ? 0.03 : 0) + (st.id === 'road' ? 0.025 : 0), 0, 0.13);
  const play = { fidx: best.i, cutIdx: best.it.i, cutT: best.it.t,
                 pt: { x: P.x, y: P.y, z: P.z }, air: best.it.air, moves: [] };
  /* someone has to be standing on the bag when the throw gets there */
  const sendTo = (bx, bz, fromPt, arm, after) => {
    const dur = throwTime(fromPt, bx, bz, arm);
    const ci = coverFor(bx, bz, play.fidx);
    if (ci >= 0 && ci !== play.fidx) {
      const st2 = G.stations[ci];
      const isC = st2.k === 'C';               // he sets up just behind the plate
      const tx2 = isC ? 0 : bx, tz2 = isC ? -1.1 : bz;
      // never drag someone clear across the diamond to take a routine lob
      if (dist2(st2.x, st2.z, tx2, tz2) < 34)
        play.moves.push({ idx: ci, x: tx2, z: tz2, byT: (after || play.cutT) + dur });
    }
    return dur;
  };
  const aimAt = (bx, bz) => {
    play.throwTo = [bx, bz];
    play.throwDur = sendTo(bx, bz, P, best.pl.arm);
  };

  /* ---- caught on the fly ---- */
  if (best.it.air) {
    if (chance(errP * 0.55)) {
      G.errs[1 - G.half]++;
      fumble(play, P);
      aimAt(BASE_POS[1][0], BASE_POS[1][1]);
      return { kind: 'error', bases: fl.dist > 62 ? 2 : 1, err: true, play,
               text: `${best.s.sn}が落球！\nエラー` };
    }
    const liner = fl.la < 24 && fl.hang < 1.7;
    const tight = best.it.t > fl.hang - 0.45;
    // an infielder just holds it; only an outfielder lobs the ball back in
    if (best.s.infield) { play.throwTo = null; play.throwDur = 0; }
    else aimAt(MOUND_POS[0], MOUND_POS[1]);
    return { kind: 'flyout', outs: 1, fielder: best.s, play,
      canSac: !liner && Math.hypot(P.x, P.z) > 48,
      text: liner ? `${best.s.sn}ライナー\nアウト`
        : (tight ? `${best.s.sn}が好捕！\nアウト` : `${best.s.sn}フライ\nアウト`) };
  }

  /* ---- played off the ground: race the throw to the bag ---- */
  let safeTo = 0;
  for (let n = 1; n <= 3; n++) {
    const arrives = best.it.t + throwTime(P, basePt(n - 1)[0], basePt(n - 1)[1], best.pl.arm);
    if (arrives > baseTime(bat, n) + 0.12) safeTo = n; else break;
  }
  const infield = best.s.infield;
  const outDist = Math.hypot(P.x, P.z);
  // nobody throws the batter out at first from deep in the outfield
  if (safeTo === 0 && !infield && outDist > 40) safeTo = 1;
  // once it is past the outfielders he is standing on second before the relay
  if (!infield && outDist > fenceAt(st, fl.ang) * 0.76 + 6) safeTo = Math.max(safeTo, 2);

  if (chance(errP)) {
    G.errs[1 - G.half]++;
    fumble(play, P);
    aimAt(BASE_POS[0][0], BASE_POS[0][1]);
    return { kind: 'error', bases: Math.max(1, safeTo), err: true, play,
             text: `${best.s.sn}がはじいた！\nエラー` };
  }

  if (safeTo === 0) {
    if (G.bases[0] && G.outs < 2 && infield && fl.v0 > 17
        && chance(0.34 + best.pl.defense * 0.28)) {
      // ball to the third-base side: the second baseman takes the bag and the
      // shortstop backs him up; to the first-base side it is the other way round
      const leftSide = fl.ang > 0;
      let pivotK = leftSide ? '2B' : 'SS', backK = leftSide ? 'SS' : '2B';
      if (stationIdx(pivotK) === best.i) { const t2 = pivotK; pivotK = backK; backK = t2; }
      const pivotI = stationIdx(pivotK), backI = stationIdx(backK);
      const pivotP = fielderOf(def, pivotK);
      const bag2 = BASE_POS[1], bag1 = BASE_POS[0];

      play.via = bag2;
      play.viaDur = throwTime(P, bag2[0], bag2[1], best.pl.arm);
      play.moves.push({ idx: pivotI, x: bag2[0], z: bag2[1], byT: play.cutT + play.viaDur });
      if (backI >= 0 && backI !== best.i)     // the other one converges as back-up
        play.moves.push({ idx: backI, x: bag2[0] + (leftSide ? 2.6 : -2.6), z: bag2[1] + 3.4,
                          byT: play.cutT + play.viaDur });
      play.throwTo = bag1;
      play.throwDur = throwTime({ x: bag2[0], z: bag2[1] }, bag1[0], bag1[1], pivotP.arm);
      const fbI = coverFor(bag1[0], bag1[1], best.i);
      if (fbI >= 0 && fbI !== best.i && fbI !== pivotI)
        play.moves.push({ idx: fbI, x: bag1[0], z: bag1[1],
                          byT: play.cutT + play.viaDur + play.throwDur });
      return { kind: 'dp', outs: 2, fielder: best.s, play,
               text: `${best.s.sn}→${pivotK === '2B' ? 'セカンド' : 'ショート'}→ファースト\nゲッツー！` };
    }
    if (G.bases[0] && G.outs < 2 && chance(0.22)) {
      aimAt(BASE_POS[1][0], BASE_POS[1][1]);
      return { kind: 'fc', outs: 1, fielder: best.s, play,
               text: `${best.s.sn}\nフィルダースチョイス` };
    }
    aimAt(BASE_POS[0][0], BASE_POS[0][1]);
    return { kind: 'groundout', outs: 1, fielder: best.s, play,
             text: `${best.s.sn}ゴロ\nアウト` };
  }

  /* ---- a base hit ---- */
  if (infield) {
    aimAt(BASE_POS[0][0], BASE_POS[0][1]);
  } else if (G.bases[1] || G.bases[2]) {
    aimAt(HOME_POS[0], HOME_POS[1]);        // a runner is coming round: back home
  } else if (safeTo === 2) {
    aimAt(BASE_POS[1][0], BASE_POS[1][1]);  // he is pulling into second: throw there
  } else {
    // never throw to the bag ahead of the runner from the outfield — a throw to
    // third on a triple only opens up the plate. It goes to the cut-off man.
    const d0 = Math.hypot(P.x, P.z) || 1;
    const rx = (P.x / d0) * 36, rz = (P.z / d0) * 36;
    let cutK = fl.ang > 0 ? 'SS' : '2B';
    if (stationIdx(cutK) === best.i) cutK = cutK === 'SS' ? '2B' : 'SS';
    const ci = stationIdx(cutK);
    play.throwTo = [rx, rz];
    play.throwDur = throwTime(P, rx, rz, best.pl.arm);
    if (ci >= 0 && ci !== best.i)
      play.moves.push({ idx: ci, x: rx, z: rz, byT: play.cutT + play.throwDur });
  }
  if (st.fenceH === 0 && safeTo === 3 && bat.speed > 0.72 && chance(0.22))
    return { kind: 'ihr', bases: 4, hit: true, big: true, play, text: 'ランニングホームラン！' };
  const carNote = fl.carHit ? '車に当たった！\n' : downNote;
  const text = carNote + (safeTo === 3 ? `${best.s.sn}へ\nスリーベースヒット！`
    : safeTo === 2 ? `${best.s.sn}へ\nツーベースヒット！`
    : infield ? '内野安打！'
    : outDist < 46 ? 'ポテンヒット！' : `${best.s.sn}前ヒット！`);
  return { kind: 'hit', bases: safeTo, hit: true, play, text };
}

/* ============================================================
   base running
   ============================================================ */
/* A runner follows the base paths and touches every bag on the way, so a man
   on first going to third rounds second instead of cutting the corner. */
function moveRunner(p, from, to, delay, retired) {
  const pts = [];
  for (let b = from; b <= to; b++) {
    let q = basePt(b);
    if (b === from && b >= 0 && b <= 2) {      // he was already off the bag
      const n2 = basePt(b + 1);
      const ux = n2[0] - q[0], uz = n2[1] - q[1], ul = Math.hypot(ux, uz) || 1;
      q = [q[0] + (ux / ul) * LEAD_OFF, q[1] + (uz / ul) * LEAD_OFF];
    }
    // bags he only rounds are taken a little wide, as a runner actually does
    if (b > from && b < to && b >= 0 && b <= 2) {
      const ox = q[0] - 0, oz = q[1] - 19.4, l = Math.hypot(ox, oz) || 1;
      pts.push([q[0] + (ox / l) * 1.7, q[1] + (oz / l) * 1.7]);
    } else pts.push([q[0], q[1]]);
  }
  if (pts.length < 2) pts.push(basePt(to));
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push(d); total += d;
  }
  const legs = Math.max(1, to - from);
  // the first 90 feet take exactly as long as the ruling gives him, so a throw
  // that beats him is seen to beat him; later bases are compressed a little
  const first = 27.43 / (5.6 + p.speed * 1.7);
  const rest = 27.43 / (7.6 + p.speed * 2.2);
  let dur = first * (legs === 1 ? 1 : 0.72) + (legs - 1) * rest * 0.48;
  if (legs >= 4) dur = Math.min(dur, 6.0);
  G.movers.push({
    p, from, to, pts, segs, total, t: -(delay || 0), dur,
    scored: to >= 3, retired: !!retired,
    rbiOwner: to >= 3 ? curBatter() : null,
  });
}

function scoreRun(p, batter) {
  G.score[G.half]++;
  if (batter) batter.rbi++;
}

function advanceOnHit(nb, batter) {
  let runs = 0, block = null;
  for (let i = 2; i >= 0; i--) {
    const r = G.bases[i];
    if (!r) continue;
    let adv = nb;
    if (nb < 3 && r.speed > 0.5 && chance(0.22 + r.speed * 0.34)) adv++;
    let t = i + adv;
    if (block !== null) t = Math.min(t, block - 1);
    G.bases[i] = null;
    if (t >= 3) { runs++; scoreRun(r, batter); moveRunner(r, i, 3); }
    else { G.bases[t] = r; block = t; moveRunner(r, i, t); }
  }
  let bt = nb - 1;
  if (block !== null) bt = Math.min(bt, block - 1);
  if (bt >= 3) { runs++; scoreRun(batter, batter); moveRunner(batter, -1, 3); }
  else { G.bases[bt] = batter; moveRunner(batter, -1, bt); }
  return runs;
}

function advanceOnWalk(batter) {
  let runs = 0;
  if (G.bases[0]) {
    if (G.bases[1]) {
      if (G.bases[2]) { runs++; scoreRun(G.bases[2], batter); moveRunner(G.bases[2], 2, 3); G.bases[2] = null; }
      G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2); G.bases[1] = null;
    }
    G.bases[1] = G.bases[0]; moveRunner(G.bases[0], 0, 1); G.bases[0] = null;
  }
  G.bases[0] = batter; moveRunner(batter, -1, 0);
  return runs;
}

/* everyone still on base moves up one, lead runner first */
function advanceOneAll(batter, allowScore) {
  let runs = 0;
  for (let i = 2; i >= 0; i--) {
    const r = G.bases[i];
    if (!r) continue;
    G.bases[i] = null;
    if (i === 2) {
      if (allowScore) { runs++; scoreRun(r, batter); moveRunner(r, 2, 3); }
      else G.bases[2] = r;
    } else { G.bases[i + 1] = r; moveRunner(r, i, i + 1); }
  }
  return runs;
}

/* ============================================================
   applying an outcome
   ============================================================ */
function applyOutcome(o) {
  const bat = curBatter();
  let runs = 0, outsAdded = 0;
  G.movers = [];

  switch (o.kind) {
    case 'hr': case 'ihr':
      bat.ab++; bat.h++; bat.hr++; G.hits[G.half]++;
      runs = advanceOnHit(4, bat);
      Snd.cheer();
      break;
    case 'hit': case 'ground_rule':
      bat.ab++; bat.h++; G.hits[G.half]++;
      runs = advanceOnHit(o.bases, bat);
      Snd.good();
      break;
    case 'error':
      bat.ab++;
      runs = advanceOnHit(o.bases, bat);
      Snd.bad();
      break;
    case 'flyout': {
      bat.ab++; outsAdded = 1; moveRunner(bat, -1, 0, 0, true);
      // a runner tagging up cannot leave until the ball is caught
      const held = o.play ? o.play.cutT + 0.12 : 1.2;
      if (o.canSac && G.outs < 2 && G.bases[2]) {
        runs++; scoreRun(G.bases[2], bat); moveRunner(G.bases[2], 2, 3, held); G.bases[2] = null;
        o.text = '犠牲フライ！\n1点';
      } else if (G.outs < 2 && G.bases[1] && o.canSac && chance(0.62)) {
        G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2, held); G.bases[1] = null;
      }
      Snd.mitt();
      break;
    }
    case 'groundout':
      bat.ab++; outsAdded = 1; moveRunner(bat, -1, 0, 0, true);
      // with the play going to first, everyone else moves up
      if (chance(0.86)) runs += advanceOneAll(bat, G.outs < 2 && chance(0.85));
      Snd.mitt();
      break;
    case 'fc':
      bat.ab++; outsAdded = 1;
      if (G.bases[2]) { runs++; scoreRun(G.bases[2], bat); moveRunner(G.bases[2], 2, 3); G.bases[2] = null; }
      if (G.bases[1]) { G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2); G.bases[1] = null; }
      G.bases[0] = bat; moveRunner(bat, -1, 0);
      Snd.mitt();
      break;
    case 'dp': {
      bat.ab++; outsAdded = Math.min(2, 3 - G.outs);
      const forced = G.bases[0];
      G.bases[0] = null;
      moveRunner(bat, -1, 0, 0, true);
      if (forced) moveRunner(forced, 0, 1, 0, true);
      runs += advanceOneAll(bat, G.outs < 2);
      if (G.bases[1]) { G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2); G.bases[1] = null; }
      Snd.mitt();
      break;
    }
    case 'strikeout':
      bat.ab++; bat.k++; outsAdded = 1;
      Snd.miss();
      break;
    case 'walk':
      bat.bb++;
      runs = advanceOnWalk(bat);
      break;
    case 'hbp':
      bat.hbp++;
      runs = advanceOnWalk(bat);
      // he takes a moment to shake it off before trotting down
      for (const mv of G.movers) mv.t = -0.65;
      G.hbpT = 1.05;
      Snd.crash();
      logLine(`${bat.name}にデッドボール！`, true);
      break;
    case 'bunt_out':
      bat.ab++; outsAdded = 1; moveRunner(bat, -1, 0, 0, true);
      runs += advanceOneAll(bat, G.outs < 2);
      break;
  }

  G.outs += outsAdded;
  if (runs > 0) {
    logLine(`${bat.name}の${o.kind === 'walk' ? '押し出し' : (o.text.split('\n')[0])} — ${runs}点`, true);
  }
  G.inningRuns += runs;
  G.lastText = o.text;
  banner(o.text, o.big);
  uiScore();

  // hand the ball back to the fielders
  placeFielders();
  return runs;
}

/* ============================================================
   count handling
   ============================================================ */
function afterPitch(kind) {
  const bat = curBatter();
  if (kind === 'hbp') {
    finishAtBat({ kind: 'hbp', text: 'デッドボール！' });
    return;
  }
  if (kind === 'ball') {
    G.balls++;
    if (G.balls >= 4) { finishAtBat({ kind: 'walk', text: 'フォアボール' }); return; }
    banner('ボール');
    uiScore(); setPhase('result', 0.70);
    return;
  }
  if (kind === 'strike' || kind === 'whiff' || kind === 'foul') {
    if (kind === 'foul' && G.strikes >= 2) { banner('ファウル'); uiScore(); setPhase('result', 0.70); return; }
    G.strikes++;
    if (G.strikes >= 3) {
      finishAtBat({ kind: 'strikeout', text: kind === 'whiff' ? '空振り三振！' : '見逃し三振！' });
      return;
    }
    banner(kind === 'whiff' ? '空振り' : kind === 'foul' ? 'ファウル' : 'ストライク');
    if (kind === 'whiff') Snd.miss();
    uiScore(); setPhase('result', 0.70);
  }
}

function finishAtBat(o) {
  applyOutcome(o);
  logLine(`${G.inning}回${G.half === 0 ? '表' : '裏'} ${curBatter().name}：${o.text.replace('\n', ' ')}`);
  G.order[G.half] = (G.order[G.half] + 1) % 9;
  if (!G.flight) G.ball.vis = false;   // a batted ball stays on screen
  setPhase('play', Math.max(1.5, playLength()));
}

function playLength() {
  let m = 1.4;
  for (const mv of G.movers) if (!mv.retired) m = Math.max(m, Math.min(mv.dur - mv.t + 0.5, 6.6));
  const pl = G.playScript;
  if (pl) m = Math.max(m, pl.cutT + (pl.fumble ? FUMBLE_T + 0.45 : 0)
                          + (pl.viaDur || 0) + (pl.via ? 0.28 : 0)
                          + (pl.throwDur || 0) + 0.7);
  else if (G.flight) m = Math.max(m, Math.min(G.flight.total, 5.0) + 0.8);
  return m;
}

/* ============================================================
   innings
   ============================================================ */
function endHalfInning() {
  let onBase = 0;
  for (const b of G.bases) if (b) onBase++;
  G.lob[G.half] += onBase;
  recordInningRuns(G.half, G.inning, G.inningRuns);
  G.inningRuns = 0;
  G.bases = [null, null, null];
  G.outs = 0;
  G.movers = [];
  logLine(`${G.inning}回${G.half === 0 ? '表' : '裏'}おわり — ${G.away.name} ${G.score[0]} : ${G.score[1]} ${G.home.name}`, true);

  if (G.half === 0) {
    G.half = 1;
    // home team leads after the top of the 9th or later: no need to bat
    if (G.inning >= G.innings && G.score[1] > G.score[0]) { endGame(); return; }
  } else {
    G.half = 0; G.inning++;
    if (G.inning > G.innings && G.score[0] !== G.score[1]) { endGame(); return; }
    if (G.inning > G.innings + 3) { endGame(); return; }   // three extra, then a tie
  }
  uiScore();
  banner(`${G.inning}回${G.half === 0 ? '表' : 'ウラ'}`);
  setPhase('halfend', 1.6);
}

function inningLine(half, inn) {
  while (G.lines[half].length < inn) G.lines[half].push(null);
}

function recordInningRuns(half, inn, runs) {
  inningLine(half, inn);
  G.lines[half][inn - 1] = (G.lines[half][inn - 1] || 0) + runs;
}

function endGame() {
  if (G.inningRuns > 0) { recordInningRuns(G.half, G.inning, G.inningRuns); G.inningRuns = 0; }
  G.over = true; G.active = false;
  setPhase('gameover', 0);
  showResult();
}

/* walk-off check after runs score in the bottom half */
function checkWalkoff() {
  if (G.half === 1 && G.inning >= G.innings && G.score[1] > G.score[0]) {
    logLine('サヨナラ！', true);
    banner('サヨナラ！', true);
    Snd.cheer();
    setPhase('walkoff', 2.1);
    return true;
  }
  return false;
}

   50-main.js — screens, input, the frame loop, and drawing

'use strict';

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

const CAM = { ex: 0, ey: 4, ez: -14, tx: 0, ty: 1.4, tz: 14, fov: 46 };
const KEYS = Object.create(null);
let chosenStadium = null, teamPick = 0, team1 = null;

function showTeamPick() {
  const vs = G.mode === 'vs';
  $('#team-head').textContent = vs
    ? (teamPick === 0 ? '1P（先攻）のチームは？' : '2P（後攻）のチームは？')
    : 'どのチームを使う？';
  $('#team-sub').innerHTML = vs
    ? (teamPick === 0
        ? '1Pは<b>先攻</b>。1回表に打って、裏は投げます。'
        : '2Pは<b>後攻</b>。1回表は投げて、裏に打ちます。')
    : 'あなたは<b>先攻</b>。1回表からいきなり打席に立ちます。';
  show('#s-team');
}

function togglePause() {
  if (!G.active || G.over) return;
  G.paused = !G.paused;
  if (G.paused) {
    $('#pause-score').textContent =
      `${G.inning}回${G.half === 0 ? '表' : '裏'}  ${G.away.name} ${G.score[0]} - ${G.score[1]} ${G.home.name}`;
    show('#s-pause');
  } else show(null);
}

/* ============================================================
   card art — 2D sketches so the menus show what you are picking
   ============================================================ */
function faceCanvas(team, w, h) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  const A = ANIMALS[team.animal];
  g.fillStyle = '#20303F'; g.fillRect(0, 0, w, h);
  // pennant stripes behind the face
  g.fillStyle = team.uni;
  for (let i = -2; i < 10; i++) { g.beginPath(); g.moveTo(i * 22, h); g.lineTo(i * 22 + 26, 0); g.lineTo(i * 22 + 38, 0); g.lineTo(i * 22 + 12, h); g.fill(); }
  g.globalAlpha = 0.22; g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.globalAlpha = 1;

  const cx = w / 2, cy = h * 0.60, r = h * 0.34;
  const ear = (dx, dy, rr) => { g.beginPath(); g.arc(cx + dx, cy + dy, rr, 0, 7); g.fill(); };
  g.fillStyle = A.fur;
  if (A.ear === 'round') { ear(-r * 0.82, -r * 0.72, r * 0.36); ear(r * 0.82, -r * 0.72, r * 0.36); }
  if (A.ear === 'point') {
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * r * 0.3, cy - r * 0.8); g.lineTo(cx + s * r * 0.95, cy - r * 1.35); g.lineTo(cx + s * r * 1.0, cy - r * 0.5); g.fill(); }
  }
  if (A.ear === 'toad') { ear(-r * 0.72, -r * 0.66, r * 0.34); ear(r * 0.72, -r * 0.66, r * 0.34); }
  g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  // cap
  g.fillStyle = team.cap;
  g.beginPath(); g.arc(cx, cy - r * 0.16, r * 1.0, Math.PI, 0); g.fill();
  g.fillRect(cx - r * 1.05, cy - r * 0.2, r * 2.1, r * 0.16);
  g.beginPath(); g.ellipse(cx, cy - r * 0.16, r * 1.25, r * 0.2, 0, Math.PI, 0); g.fill();
  g.fillStyle = team.trim; g.beginPath(); g.arc(cx, cy - r * 1.1, r * 0.12, 0, 7); g.fill();
  // long ears sit on top of the cap, not under it
  if (A.ear === 'long') {
    for (const s of [-1, 1]) {
      g.save(); g.translate(cx + s * r * 0.46, cy - r * 1.16); g.rotate(s * 0.26);
      g.fillStyle = A.fur; g.beginPath(); g.ellipse(0, 0, r * 0.23, r * 0.66, 0, 0, 7); g.fill();
      g.fillStyle = A.fur2; g.beginPath(); g.ellipse(0, r * 0.06, r * 0.11, r * 0.44, 0, 0, 7); g.fill();
      g.restore();
    }
  }
  // muzzle + eyes
  g.fillStyle = A.fur2;
  g.beginPath(); g.ellipse(cx, cy + r * 0.36, r * 0.44, r * 0.32, 0, 0, 7); g.fill();
  if (A.beak) {
    g.fillStyle = A.beak;
    g.beginPath(); g.moveTo(cx - r * 0.20, cy + r * 0.26); g.lineTo(cx + r * 0.20, cy + r * 0.26);
    g.lineTo(cx, cy + r * 0.66); g.closePath(); g.fill();
  }
  g.fillStyle = '#22282F';
  if (A.ear === 'toad') { g.fillStyle = A.fur; ear(-r * 0.72, -r * 0.66, r * 0.34); ear(r * 0.72, -r * 0.66, r * 0.34); g.fillStyle = '#22282F'; ear(-r * 0.72, -r * 0.72, r * 0.15); ear(r * 0.72, -r * 0.72, r * 0.15); }
  g.beginPath(); g.ellipse(cx - r * 0.34, cy + r * 0.02, r * 0.11, r * 0.14, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(cx + r * 0.34, cy + r * 0.02, r * 0.11, r * 0.14, 0, 0, 7); g.fill();
  if (!A.beak) { g.beginPath(); g.ellipse(cx, cy + r * 0.26, r * 0.13, r * 0.10, 0, 0, 7); g.fill(); }
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(cx - r * 0.30, cy - r * 0.04, r * 0.045, 0, 7); g.fill();
  g.beginPath(); g.arc(cx + r * 0.38, cy - r * 0.04, r * 0.045, 0, 7); g.fill();
  if (A.brow) {                      // the drawn brow line, as on the model
    g.strokeStyle = '#3A2A1A'; g.lineWidth = r * 0.11; g.lineCap = 'round';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(cx + s * r * 0.16, cy - r * 0.30);
      g.lineTo(cx + s * r * 0.52, cy - r * 0.24);
      g.stroke();
    }
  }
  return c;
}

function parkCanvas(st, w, h) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  const [a, b, sky] = st.cardColors;
  const horizon = h * 0.52;
  g.fillStyle = sky; g.fillRect(0, 0, w, horizon);
  g.fillStyle = a; g.fillRect(0, horizon, w, h - horizon);
  const rect = (x, y, ww, hh, f) => { g.fillStyle = f; g.fillRect(x, y, ww, hh); };
  if (st.id === 'dome') {
    rect(0, horizon - 12, w, 12, '#2F6C57');
    for (let i = 0; i < 5; i++) rect(6 + i * 26, horizon - 30, 4, 30, '#5A6A78');
    g.fillStyle = b; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2 - 46, horizon + 4); g.lineTo(w / 2 + 46, horizon + 4); g.fill();
    g.fillStyle = '#F4EFE2'; g.beginPath(); g.arc(w / 2, h - 8, 4, 0, 7); g.fill();
  }
  if (st.id === 'road') {
    for (let i = 0; i < 4; i++) { rect(2 + i * 16, horizon - 34 - i * 4, 13, 34 + i * 4, i % 2 ? '#8C7F72' : '#7A8A93'); rect(w - 15 - i * 16, horizon - 30 - i * 5, 13, 30 + i * 5, i % 2 ? '#9A8577' : '#6F7C86'); }
    rect(w / 2 - 34, horizon - 16, 68, 16, '#7E8489');
    for (let i = 0; i < 4; i++) rect(w / 2 - 2, horizon + 6 + i * 12, 4, 7, b);
    rect(w / 2 - 26, h - 16, 16, 9, '#D9483B'); rect(w / 2 + 12, h - 20, 16, 9, '#3E6FBF');
  }
  if (st.id === 'market') {
    rect(0, 0, w, 14, '#C4C7BE');
    for (let i = 0; i < 5; i++) rect(8 + i * 24, 4, 16, 4, '#FFF8DC');
    for (let i = 0; i < 4; i++) { rect(10 + i * 30, horizon - 22, 22, 22, '#9EA6A2'); for (let j = 0; j < 3; j++) rect(12 + i * 30, horizon - 20 + j * 7, 18, 4, [b, '#F2C14E', '#7FB3D5'][j]); }
    for (let x = 0; x < w; x += 14) for (let y = horizon; y < h; y += 14) rect(x, y, 13, 13, ((x + y) / 14) % 2 ? '#DCDDD4' : '#D0D2C8');
  }
  if (st.id === 'river') {
    rect(0, horizon - 10, w, 10, '#6FA8C4');
    for (let i = 0; i < 6; i++) { g.fillStyle = '#5E8A3E'; g.beginPath(); g.arc(10 + i * 34, horizon - 12, 9, 0, 7); g.fill(); g.fillStyle = '#6B4A32'; g.fillRect(9 + i * 34, horizon - 12, 3, 12); }
    g.fillStyle = b; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2 - 40, horizon + 6); g.lineTo(w / 2 + 40, horizon + 6); g.fill();
  }
  if (st.id === 'moon') {
    g.fillStyle = '#E8EEFA';
    for (let i = 0; i < 40; i++) { const x = Math.random() * w, y = Math.random() * horizon; g.fillRect(x, y, 1.5, 1.5); }
    g.fillStyle = '#3E6FA8'; g.beginPath(); g.arc(w * 0.78, horizon * 0.42, 16, 0, 7); g.fill();
    g.fillStyle = '#5E9A5E'; g.beginPath(); g.arc(w * 0.74, horizon * 0.36, 6, 0, 7); g.fill();
    g.fillStyle = '#6E6E76';
    for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(Math.random() * w, horizon + 8 + Math.random() * (h - horizon - 8), 8 + Math.random() * 12, 4, 0, 0, 7); g.fill(); }
  }
  return c;
}

function uiHint() {
  // in a two-player game the controls hand over at the release; against the
  // computer the side you are on does not change mid-pitch
  const pitching = G.mode === 'vs' ? (G.phase === 'aim' || G.phase === 'ready') : !userBatting();
  const touch = matchMedia('(pointer:coarse)').matches;
  const who = G.mode === 'vs' ? (pitching ? `${pitchingPlayer()} ` : `${battingPlayer()} `) : '';
  const keys = !pitching
    ? (touch ? [['ドラッグ', 'ねらう'], ['タップ', 'スイング']]
             : [['矢印 / マウス', 'ねらう'], ['SPACE', 'スイング'], ['SHIFT+SPACE', 'バント']])
    : (touch ? [['球種ボタン', 'えらぶ'], ['ドラッグ', 'コース'], ['タップ', '投げる']]
             : [['1〜5', '球種'], ['矢印 / マウス', 'コース'], ['SPACE', '投げる']]);
  $('#hint').innerHTML = (who ? `<span class="key act"><kbd>${who.trim()}</kbd>${pitching ? 'が投げる' : 'が打つ'}</span>` : '')
    + keys.map(([k, d]) => `<span class="key"><kbd>${k}</kbd>${d}</span>`).join('');
  const pp = $('#pitchpick');
  pp.classList.toggle('hidden', !pitching || !G.active);
  if (pitching) {
    pp.innerHTML = PITCHES.map((p, i) =>
      `<button class="pc${i === G.pitchType ? ' sel' : ''}" data-i="${i}">${p.nm}<small>${i + 1} · ${p.en}</small></button>`).join('');
    for (const el of pp.querySelectorAll('.pc'))
      el.onclick = () => { G.pitchType = +el.dataset.i; uiHint(); };
  }
}

function showResult() {
  const innings = Math.max(G.innings, G.lines[0].length, G.lines[1].length);
  const head = ['<tr><th></th>'];
  for (let i = 0; i < innings; i++) head.push(`<th>${i + 1}</th>`);
  head.push('<th>R</th><th>H</th><th>E</th></tr>');
  const row = (side, team) => {
    const cells = [`<td class="nm">${team.name}</td>`];
    for (let i = 0; i < innings; i++) {
      const v = G.lines[side][i];
      cells.push(`<td>${v === null || v === undefined ? '&ndash;' : v}</td>`);
    }
    cells.push(`<td class="tot">${G.score[side]}</td><td>${G.hits[side]}</td><td>${G.errs[side]}</td>`);
    return `<tr>${cells.join('')}</tr>`;
  };
  $('#res-line').innerHTML = head.join('') + row(0, G.away) + row(1, G.home);

  const w = G.score[0] === G.score[1] ? null : (G.score[0] > G.score[1] ? 0 : 1);
  $('#res-head').textContent = w === null ? '引き分け'
    : G.mode === 'vs' ? `${w === 0 ? '1P' : '2P'}の勝ち！ — ${(w === 0 ? G.away : G.home).name}`
    : w === G.userSide ? 'あなたの勝ち！'
    : `${(w === 0 ? G.away : G.home).name}の勝ち`;

  // best hitter of the game
  let star = null;
  for (const t of [G.away, G.home]) for (const p of t.roster) {
    const s = p.h * 2 + p.hr * 3 + p.rbi;
    if (!star || s > star.s) star = { s, p, t };
  }
  $('#res-stats').innerHTML = [
    `<span class="pill">球場 <b>${G.st.name}</b></span>`,
    `<span class="pill">${innings > G.innings ? '延長' + innings + '回' : G.innings + '回'}</span>`,
    star ? `<span class="pill">お手柄 <b>${star.p.name}</b> ${star.p.h}安打 ${star.p.rbi}打点</span>` : '',
  ].join('');
  show('#s-result');
}

/* ============================================================
   input
   ============================================================ */
const pointer = { x: 0.5, y: 0.5, has: false };

function bindInput() {
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    KEYS[e.code] = true;
    if (!G.active) return;
    if (e.code === 'Escape') { togglePause(); return; }
    if (G.paused) return;
    if (e.code === 'Space') {
      e.preventDefault();
      Snd.boot();
      if (G.phase === 'aim' && humanPitches()) throwPitch(G.pitchType, G.reticle.x, G.reticle.y);
      else if (G.phase === 'pitch' && humanBats()) playerSwing(e.shiftKey || KEYS.ShiftLeft || KEYS.ShiftRight);
    }
    if (G.phase === 'aim' && humanPitches() && e.code >= 'Digit1' && e.code <= 'Digit5') {
      G.pitchType = +e.code.slice(5) - 1; uiHint();
    }
  });
  addEventListener('keyup', (e) => { KEYS[e.code] = false; });

  const cv = $('#gl');
  const track = (e) => {
    const r = cv.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) / r.width;
    pointer.y = (e.clientY - r.top) / r.height;
    pointer.has = true;
  };
  cv.addEventListener('pointermove', track);
  cv.addEventListener('pointerdown', (e) => {
    track(e); Snd.boot();
    if (!G.active || G.paused) return;
    if (G.phase === 'aim' && humanPitches()) throwPitch(G.pitchType, G.reticle.x, G.reticle.y);
    else if (G.phase === 'pitch' && humanBats()) playerSwing(KEYS.ShiftLeft || KEYS.ShiftRight);
  });
  addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
}

function updateAim(dt) {
  const k = 1.55 * dt;
  let moved = false;
  if (KEYS.ArrowLeft || KEYS.KeyA) { G.reticle.x += k; moved = true; }
  if (KEYS.ArrowRight || KEYS.KeyD) { G.reticle.x -= k; moved = true; }
  if (KEYS.ArrowUp || KEYS.KeyW) { G.reticle.y += k; moved = true; }
  if (KEYS.ArrowDown || KEYS.KeyS) { G.reticle.y -= k; moved = true; }
  if (!moved && pointer.has) {
    const tx = lerp(1.05, -1.05, clamp((pointer.x - 0.22) / 0.56, 0, 1));
    const ty = lerp(1.72, 0.16, clamp((pointer.y - 0.20) / 0.58, 0, 1));
    G.reticle.x += (tx - G.reticle.x) * Math.min(1, dt * 12);
    G.reticle.y += (ty - G.reticle.y) * Math.min(1, dt * 12);
  }
  G.reticle.x = clamp(G.reticle.x, -1.05, 1.05);
  G.reticle.y = clamp(G.reticle.y, 0.16, 1.72);
}

/* ============================================================
   contact -> flight
   ============================================================ */
function doContact() {
  const d = G.decided, bat = curBatter(), pc = G.pitch;
  let la, v0, dir;
  if (G.bunting) {
    la = rnd(-5, 9);
    v0 = rnd(6.5, 11) * (0.9 + bat.contact * 0.2);
    dir = rnd(-40, 40);
  } else {
    la = clamp(13 + d.dy * 96 + gauss(6), -22, 62);
    v0 = lerp(13, 43, d.q) * (0.90 + bat.power * 0.22);
    dir = clamp(-d.dt * 330 + (pc.ax - (humanBats() ? G.reticle.x : G.cpuAim.x)) * 18 + gauss(9), -58, 58);
    // catching it off the end, under it, off the handle: poor contact is fouled
    // off far more often than it is put in play
    if (chance(clamp(0.70 - d.q * 0.62, 0, 0.70))) {
      dir = (chance(0.5) ? 1 : -1) * rnd(55, 88);
      la = clamp(la + rnd(10, 38), 12, 80);
      v0 *= rnd(0.50, 0.86);
    }
  }
  G.flight = simFlight(v0, la, dir, G.st);
  G.ball.vis = true;
  G.trail.length = 0;
  Snd.hit(clamp(d.q, 0, 1));

  const o = fieldBall(G.flight);
  G.flightT = 0;
  G.playScript = o.play || null;
  G.camMode = o.kind === 'foul' ? 'foul' : 'fly';
  G.ballBoost = o.kind === 'foul' ? 1.7 : 1;

  if (o.kind === 'foul') {
    // freeze it a beat after it first lands, so it does not roll into the next
    // county with the camera chasing it
    const fl2 = G.flight;
    const gi = Math.min(fl2.groundIdx + 14, fl2.path.length - 1);
    const q = fl2.path[gi];
    G.playScript = { fidx: -1, coverIdx: -1, cutIdx: gi, cutT: q.t,
                     pt: { x: q.x, y: q.y, z: q.z }, air: false, throwTo: null, throwDur: 0 };
    G.pendingCount = 'foul';
    setPhase('play', Math.min(q.t, 1.5) + 0.45);
    banner('ファウル');
    return;
  }
  G.pendingCount = null;
  G.carStall = 0;
  if (G.flight.carHit) Snd.clang();
  finishAtBat(o);
}

/* ============================================================
   per-frame update
   ============================================================ */
function update(dt) {
  if (!G.active || G.paused) return;
  G.pt += dt;
  if (G.phase === 'pitch' || G.phase === 'aim') updateAim(dt);
  if (G.batSwingT >= 0) G.batSwingT += dt;

  switch (G.phase) {
    case 'ready':
      // never deliver until the camera is back behind the plate and the
      // pitcher has actually returned to the mound
      if (G.pt >= G.phaseLen
          && (camSettled() || G.pt > G.phaseLen + 2.2)
          && (pitcherSet() || G.pt > G.phaseLen + 3.2)) {
        if (humanPitches()) { setPhase('aim'); uiHint(); }
        else { const c = cpuPitchChoice(); throwPitch(c.ti, c.ax, c.ay); }
      }
      break;

    case 'aim':
      break;

    case 'pitch': {
      const pc = G.pitch;
      pc.t += dt;
      const p = pitchPos(pc, pc.t);
      // the ball dies in the mitt rather than carrying on through the catcher
      const cst = G.stations[1];
      const mitt = cst.z + 0.62;
      G.ball.x = p.x; G.ball.y = Math.max(p.y, 0.42); G.ball.z = Math.max(p.z, mitt);
      G.trail.unshift(p.x, p.y, p.z);
      if (G.trail.length > 42) G.trail.length = 42;
      if (!humanBats() && G.swingT >= 0 && !G.decided && pc.t >= G.swingT) {
        G.batSwingT = 0; judgeSwing();
      }
      if (G.contactAt >= 0 && pc.t >= G.contactAt) { doContact(); break; }
      if (pc.hbp && G.swingT < 0 && pc.t >= pc.T + 0.02) {
        G.ball.vis = false;
        afterPitch('hbp');
        break;
      }
      if (pc.t > pc.T + 0.42) {
        if (G.decided && G.decided.miss) afterPitch('whiff');
        else if (G.swingT >= 0) afterPitch('whiff');
        else afterPitch(pc.inZone ? 'strike' : 'ball');
        G.ball.vis = false;
      }
      break;
    }

    case 'result':
      if (G.pt >= G.phaseLen) { G.swingT = -1; G.decided = null; G.contactAt = -1; G.batSwingT = -1; G.bunting = false; setPhase('ready', 0.42); }
      break;

    case 'play': {
      if (G.flight) {
        G.flightT += dt;
        const fl = G.flight, pl = G.playScript, path = fl.path;
        const stop = pl ? Math.min(pl.cutIdx, path.length - 1) : path.length - 1;
        const p = path[Math.min(stop, Math.floor(G.flightT / (1 / 90)))];
        let bx = p.x, by = p.y, bz = p.z, live = true;

        if (pl && pl.fidx >= 0) {
          // the fielder runs to the ball and arrives with it
          const f = G.fielders[pl.fidx];
          f.scripted = true;
          const u = clamp((G.flightT - 0.22) / Math.max(0.25, pl.cutT - 0.22), 0, 1);
          const e = u * u * (3 - 2 * u);
          f.x = lerp(f.st.x, pl.pt.x, e); f.z = lerp(f.st.z, pl.pt.z, e);
          f.run = u < 1 ? 1.2 : 0;
          f.fumbling = false;
          if (pl.fumble && G.flightT > pl.cutT + 0.16) {     // go and pick it up
            const fu = clamp((G.flightT - pl.cutT - 0.16) / (FUMBLE_T + 0.25), 0, 1);
            const fe = fu * fu * (3 - 2 * fu);
            f.x = lerp(pl.pt.x, pl.fumbleTo[0], fe); f.z = lerp(pl.pt.z, pl.fumbleTo[1], fe);
            f.run = fu < 1 ? 1.2 : 0;
            f.fumbling = G.flightT < pl.cutT + 0.46;
          }
          // team-mates cover the bags and back up the play
          for (const mv of pl.moves || []) {
            const c = G.fielders[mv.idx];
            if (!c || mv.idx === pl.fidx) continue;
            c.scripted = true;
            const cu = clamp(G.flightT / Math.max(0.5, mv.byT), 0, 1);
            const ce = cu * cu * (3 - 2 * cu);
            c.x = lerp(c.st.x, mv.x, ce); c.z = lerp(c.st.z, mv.z, ce);
            c.run = cu < 1 ? 1.2 : 0;
          }
        }
        if (pl && G.flightT > pl.cutT) {
          {
            live = false;
            let tt = G.flightT - pl.cutT;
            let fromX = pl.pt.x, fromZ = pl.pt.z, fromY = Math.max(pl.pt.y, 1.0);
            let loose = false;
            if (pl.fumble) {                  // it pops out of the glove first
              if (tt <= FUMBLE_T + 0.45) {
                const u = clamp(tt / FUMBLE_T, 0, 1);
                bx = lerp(pl.pt.x, pl.fumbleTo[0], u);
                bz = lerp(pl.pt.z, pl.fumbleTo[1], u);
                by = lerp(Math.max(pl.pt.y, 0.95), 0.14, u) + Math.sin(u * Math.PI) * 0.85;
                loose = true;
              } else {
                tt -= FUMBLE_T + 0.45;
                fromX = pl.fumbleTo[0]; fromZ = pl.fumbleTo[1]; fromY = 0.7;
              }
            }
            const arc = (ax, az, ay, bx2, bz2, u) => {
              bx = lerp(ax, bx2, u); bz = lerp(az, bz2, u);
              by = lerp(ay, 1.0, u) + Math.sin(u * Math.PI) * 2.4;
              if (u >= 1) by = 1.0;
            };
            if (loose) { /* still skipping away from him */ }
            else if (pl.via) {                  // the relay through second
              if (tt <= pl.viaDur) {
                arc(fromX, fromZ, fromY, pl.via[0], pl.via[1], clamp(tt / pl.viaDur, 0, 1));
              } else {
                bx = pl.via[0]; bz = pl.via[1]; by = 1.0;
                tt -= pl.viaDur + 0.28;         // a beat on the bag, then away
                if (tt > 0 && pl.throwTo && pl.throwDur > 0)
                  arc(pl.via[0], pl.via[1], 1.0, pl.throwTo[0], pl.throwTo[1],
                      clamp(tt / pl.throwDur, 0, 1));
              }
            } else if (pl.throwTo && pl.throwDur > 0) {
              arc(fromX, fromZ, fromY, pl.throwTo[0], pl.throwTo[1], clamp(tt / pl.throwDur, 0, 1));
            } else {
              bx = pl.pt.x; by = Math.max(pl.pt.y, 0.14); bz = pl.pt.z;
            }
          }
        }
        G.ball.x = bx; G.ball.y = by; G.ball.z = bz;
        if (live) {
          G.trail.unshift(bx, by, bz);
          if (G.trail.length > 60) G.trail.length = 60;
        } else if (G.trail.length) {
          G.trail.length = Math.max(0, G.trail.length - 6);
        }
        // a foul stays on the close camera so it can snap back for the next pitch
        const foulPlay = pl && pl.fidx < 0;
        const wide = pl ? pl.cutT * 0.72 : fl.total * 0.62;
        if (!foulPlay && (G.flightT > wide || G.flightT > 2.8)) G.camMode = 'field';
      }
      if (G.pt >= G.phaseLen) endPlay();
      break;
    }

    case 'halfend':
      if (G.pt >= G.phaseLen) nextBatter();
      break;

    case 'walkoff':
      if (G.pt >= G.phaseLen) endGame();
      break;
  }

  if (G.hbpT > 0) G.hbpT -= dt;
  updateTraffic(dt);
  // runners (a flattened one lies there until he can get up)
  let stalled = false;
  for (const m of G.movers) {
    if (m.down > 0) { m.down -= dt; stalled = true; continue; }
    m.t += dt;
    if (G.traffic && !m.retired && m.t > 0 && m.t < m.dur) {
      if (m.dodge > 0) m.dodge -= dt;
      else {
        const r = runnerAt(m);
        for (const c of G.traffic) {
          if (carHits(c, r.x, 0.6, r.z, 0.30)) {
            if (!chance(c.walk ? 0.13 : 0.09)) { m.dodge = 1.3; break; }
            m.down = c.walk ? 1.3 : 1.6;
            Snd.crash();
            runOverRunner(m, !!c.walk);    // he is out where he stands
            stalled = true;
            break;
          }
        }
      }
    }
  }
  if (stalled && G.phase === 'play' && G.carStall < 2.6) { G.phaseLen += dt; G.carStall += dt; }
  // fielders drift back / converge
  for (const f of G.fielders) {
    if (!f.scripted) {
      const k = Math.min(1, dt * 3.4);         // get back to your position
      f.x += (f.tx - f.x) * k; f.z += (f.tz - f.z) * k;
      f.run = Math.hypot(f.tx - f.x, f.tz - f.z);
    }
    // a fielder making a play watches the ball; otherwise he faces the plate
    if (f.scripted && G.ball.vis) f.ry = Math.atan2(G.ball.x - f.x, G.ball.z - f.z);
    else f.ry = Math.atan2(-f.x, -f.z);
  }
  updateCamera(dt);
}

function endPlay() {
  G.carStall = 0;
  G.ballBoost = 1;
  G.camMode = 'bat';        // back behind the plate before anything else
  G.ball.vis = false;
  G.flight = null;
  G.playScript = null;
  for (const f of G.fielders) f.scripted = false;
  G.movers = [];
  G.trail.length = 0;
  if (G.pendingCount) { const c = G.pendingCount; G.pendingCount = null; afterPitch(c); return; }
  if (checkWalkoff()) return;
  if (G.outs >= 3) { endHalfInning(); return; }
  nextBatter();
}

/* ============================================================
   camera
   ============================================================ */
const camSettled = () =>
  CAM.wx === undefined ||
  Math.hypot(CAM.ex - CAM.wx, CAM.ey - CAM.wy, CAM.ez - CAM.wz) < 0.9;

/* the pitcher has to be back on the rubber before he can deliver */
const pitcherSet = () => {
  const f = G.fielders[0];
  return !f || (f.down <= 0 && Math.hypot(f.x - f.st.x, f.z - f.st.z) < 0.7);
};

function updateCamera(dt) {
  // indoors the camera must stay under the roof or it looks through it
  const ceilY = G.st && G.st.ceiling ? G.st.ceiling - 1.4 : 1e9;
  let ex, ey, ez, tx, ty, tz, fov = 46, sp = 3.2;
  if (G.camMode === 'bat') {
    const tall = clamp(1.25 - R.w / R.h, 0, 0.5);   // >0 once the view goes portrait
    ex = 0.55; ey = 4.6 + tall * 3.2; ez = -9.0 - tall * 5.0;
    tx = 0; ty = 0.4 + tall * 0.5; tz = 7.0; fov = 40; sp = 5;
  } else if (G.camMode === 'fly') {
    const b = G.ball;
    ex = b.x * 0.55; ey = clamp(6 + b.y * 0.55, 6, 46); ez = b.z * 0.30 - 21;
    tx = b.x * 0.9; ty = b.y * 0.85 + 0.6; tz = b.z * 0.96; fov = 48; sp = 3.4;
  } else if (G.camMode === 'foul') {
    // the eye stays at the plate so the ball genuinely recedes; only the aim
    // and the field of view open up to keep it in shot
    const b = G.ball;
    ex = 0.55; ey = 5.2; ez = -10.0;
    tx = clamp(b.x * 0.62, -15, 15); ty = clamp(b.y * 0.30 + 1.0, 1.0, 6.5);
    tz = 8; fov = 62; sp = 4.5;
  } else if (ceilY < 40) {
    // indoors: as high as the roof allows, and in front of the checkouts
    ex = 0; ey = Math.min(9.0, ceilY); ez = -11;
    tx = 0; ty = 0.9; tz = 28; fov = 68; sp = 1.8;
  } else {
    ex = 0; ey = 33; ez = -26;
    tx = 0; ty = 0; tz = 30; fov = 50; sp = 1.8;
  }
  ey = Math.min(ey, ceilY);
  ty = Math.min(ty, ceilY - 0.6);
  CAM.wx = ex; CAM.wy = ey; CAM.wz = ez;
  const k = Math.min(1, dt * sp);
  CAM.ex += (ex - CAM.ex) * k; CAM.ey += (ey - CAM.ey) * k; CAM.ez += (ez - CAM.ez) * k;
  CAM.tx += (tx - CAM.tx) * k; CAM.ty += (ty - CAM.ty) * k; CAM.tz += (tz - CAM.tz) * k;
  CAM.fov += (fov - CAM.fov) * k;
}

/* ============================================================
   drawing
   ============================================================ */
let clock = 0;

/* ---------- the swing ----------
   Keyframes in seconds from the press. Contact lands at 0.090s, which is
   SWING_LAG, so the barrel is in the zone exactly when the hit is judged.
     az    bat azimuth, degrees (0 = toward centre field)
     tilt  barrel elevation
     r/gy  where the hands ride: radius from the spine, and height
     ry    body turn, added to the batter's facing
     shift stride toward the pitcher                                        */
const BAT_LEN = 0.98;
/* gx/gy/gz put the bottom hand at an explicit point (gx and gz are offsets from
   the batter's spot); az/tilt aim the barrel from there. px/py/pz hint which
   way the elbows break. */
const SWING = [
  { t: 0.000, gx: 0.13, gy: 1.05, gz: -0.40, az: 145, tilt: 0.95, ry: -0.34, lean: 0.05, spread: 0.05, lgL: 0.10, lgR: -0.10, shift: 0.00, head: 1.64, px: 0.35, py: -0.70, pz: -0.45 },
  { t: 0.032, gx: 0.17, gy: 1.10, gz: -0.48, az: 152, tilt: 1.05, ry: -0.50, lean: 0.02, spread: 0.06, lgL: 0.13, lgR: -0.17, shift: -0.03, head: 1.86, px: 0.40, py: -0.65, pz: -0.50 },
  { t: 0.090, gx: -0.40, gy: 1.00, gz: 0.05, az: -90, tilt: 0.02, ry: 0.26, lean: 0.14, spread: 0.15, lgL: -0.02, lgR: 0.07, shift: 0.11, head: 0.79, px: 0.20, py: -0.90, pz: 0.10 },
  { t: 0.200, gx: -0.20, gy: 1.06, gz: 0.30, az: -40, tilt: -0.15, ry: 0.70, lean: 0.17, spread: 0.16, lgL: -0.05, lgR: 0.09, shift: 0.13, head: 0.15, px: 0.10, py: -0.90, pz: 0.30 },
  { t: 0.520, gx: 0.05, gy: 1.26, gz: 0.34, az: 45, tilt: 0.75, ry: 1.10, lean: 0.09, spread: 0.12, lgL: -0.02, lgR: 0.05, shift: 0.11, head: -0.15, px: 0.10, py: -0.75, pz: 0.45 },
];

function batterRig(t, clk) {
  let k;
  if (t < 0) {
    k = Object.assign({}, SWING[0]);           // waiting: a small bat waggle
    k.az += Math.sin(clk * 2.4) * 6.0;
    k.tilt += Math.sin(clk * 2.4 + 0.6) * 0.08;
    k.gy += Math.sin(clk * 1.9) * 0.015;
    k.gz += Math.sin(clk * 1.9 + 1.1) * 0.012;
  } else {
    const last = SWING[SWING.length - 1];
    const tt = Math.min(t, last.t);
    let i = 0;
    while (i < SWING.length - 2 && tt > SWING[i + 1].t) i++;
    const a = SWING[i], b = SWING[i + 1];
    const u = clamp((tt - a.t) / (b.t - a.t), 0, 1);
    const e = u * u * (3 - 2 * u);
    k = {};
    for (const key in a) k[key] = lerp(a[key], b[key], e);
  }
  const az = k.az * DEG, ct = Math.cos(k.tilt), st = Math.sin(k.tilt);
  const grip = [BAT_X + k.gx, k.gy, BAT_Z + k.gz];
  const dir = [Math.sin(az) * ct, st, Math.cos(az) * ct];
  const on = (d) => [grip[0] + dir[0] * d, grip[1] + dir[1] * d, grip[2] + dir[2] * d];
  k.grip = grip; k.dir = dir; k.bx = BAT_X; k.bz = BAT_Z + k.shift;
  // right-handed hitter: left hand at the knob, right hand above it. The
  // character's local +x side faces the pitcher, so that is the left arm.
  k.topAt = 0.20; k.botAt = 0.06;
  k.handTop = on(k.topAt);
  k.handBot = on(k.botAt);
  k.pole = [k.px, k.py, k.pz];
  return k;
}

/* runners follow the base-path polyline, touching every bag */
function runnerAt(m) {
  const u = clamp(m.t / m.dur, 0, 1);
  const e = u * u * (3 - 2 * u);
  let d = e * m.total;
  const n = m.segs.length;
  for (let i = 0; i < n; i++) {
    if (d <= m.segs[i] || i === n - 1) {
      const k = m.segs[i] > 1e-6 ? clamp(d / m.segs[i], 0, 1) : 1;
      const a = m.pts[i], b = m.pts[i + 1];
      return { x: lerp(a[0], b[0], k), z: lerp(a[1], b[1], k), done: u >= 1, u,
               ry: Math.atan2(b[0] - a[0], b[1] - a[1]) };
    }
    d -= m.segs[i];
  }
  return { x: m.pts[0][0], z: m.pts[0][1], done: u >= 1, u, ry: 0 };
}

/* a hand target, pulled back so it stays within `max` of the shoulder */
function reachFrom(sx, sy, sz, tx, ty, tz, max) {
  const dx = tx - sx, dy = ty - sy, dz = tz - sz;
  const d = Math.hypot(dx, dy, dz) || 1;
  const k = Math.min(1, max / d);
  return [sx + dx * k, sy + dy * k, sz + dz * k];
}

function drawScene() {
  const st = G.st;
  const env = { light: st.light, skyTint: st.skyTint, gndTint: st.gndTint, fog: st.fog, fogDist: st.fogDist };
  R.begin(CAM, env);
  G.scene.draw();

  const bt = batTeam(), ft = fldTeam();
  const bob = Math.sin(clock * 2.2) * 0.03;
  if (G.traffic) for (const c of G.traffic) { if (c.walk) drawShopper(c); else drawCar(c); }

  // fielders
  for (let i = 0; i < G.fielders.length; i++) {
    const f = G.fielders[i];
    const pl = ft.roster.find((r) => r.pos === f.st.k) || ft.roster[i];
    const running = f.run > 0.6;
    const swing = running ? Math.sin(clock * 13) * 0.8 : 0;
    const pose = {
      armL: running ? swing * 0.7 : 0.2 + bob, armR: running ? -swing * 0.7 : -0.2 - bob,
      legL: swing, legR: -swing, bob: running ? Math.abs(Math.sin(clock * 13)) * 0.06 : bob * 0.5,
    };
    if (f.down > 0) {                       // run over: flat on his back
      const settle = clamp(f.down * 2.2, 0, 1);
      drawAnimal(f.x, f.z, f.ry, pl.look, {
        fall: -1.45, spread: 0.18, legL: -0.5, legR: 0.4,
        armL: -1.1, armR: 1.1, bob: -0.30,
      }, 0);
      for (let s2 = 0; s2 < 3; s2++) {
        const a2 = clock * 5 + s2 * 2.1;
        R.b('sphere', f.x + Math.cos(a2) * 0.34, 0.92 + Math.sin(clock * 6 + s2) * 0.05,
            f.z + Math.sin(a2) * 0.34, 0.13, 0.13, 0.13, col('#FFE04A'));
      }
      continue;
    }
    const isP = f.st.k === 'P', isC = f.st.k === 'C';
    let ry = f.ry;
    if (isP) {
      if (G.phase === 'ready') {                 // wind up
        const u = clamp(G.pt / Math.max(0.3, G.phaseLen), 0, 1);
        pose.armL = -0.5 - u * 2.0; pose.armR = -0.4 - u * 0.8; pose.legR = -u * 0.45;
      } else if (G.phase === 'pitch') {
        const t = G.pitch.t;
        if (t < 0.10 && G.ball.vis) {             // the ball is still in his hand
          pose.handL = reachFrom(f.x, 0.94, f.z, G.ball.x, G.ball.y, G.ball.z, 0.60);
          pose.pole = [0.4, -0.6, 0.2];
        }
        pose.armR = -1.6 + clamp(t * 5, 0, 2.0);
      }
    }
    // The glove goes on the LEFT hand, which is the local +x arm: a character
    // faces its local +z, so its right side is local -x. The right hand throws.
    pose.noPawR = 1;
    if (!isP && G.ball.vis) {
      const shy = 0.94 + (f.st.k === 'C' ? -0.22 : 0);
      const shx = f.x + 0.17 * Math.cos(f.ry), shz = f.z - 0.17 * Math.sin(f.ry);
      if (Math.hypot(G.ball.x - shx, G.ball.y - shy, G.ball.z - shz) < 2.3) {
        pose.handR = reachFrom(shx, shy, shz, G.ball.x,
                               clamp(G.ball.y, 0.15, 2.1), G.ball.z, 0.62);
        pose.pole = [0, -0.7, 0.5];
      }
    }
    if (f.fumbling) {                       // arms up — it got away from him
      pose.handR = null; pose.armL = -2.3; pose.armR = -2.2; pose.lean = -0.20;
    }
    if (isC && G.phase === 'pitch') {
      // the mitt sits up in front of him and only moves the last little bit to
      // meet the ball — it never chases it out toward the mound
      const shy = 0.94 - 0.22;
      let tx = f.x * 0.4, ty = 0.78, tz = f.z + 0.62;
      if (G.ball.vis && G.ball.z < f.z + 2.6) {
        tx = G.ball.x; ty = clamp(G.ball.y, 0.28, 1.75); tz = Math.max(G.ball.z, f.z + 0.42);
      }
      pose.handR = reachFrom(f.x, shy, f.z, tx, ty, tz, 0.60);
      pose.pole = [0, -0.7, 0.7];
    }
    const y0 = isC ? -0.22 : 0;
    const a = drawAnimal(f.x, f.z, ry, pl.look, pose, y0);
    if (!f.fumbling) {
      const gp = L2W(a.f, a.hr[0], a.hr[2]);
      inked(pl.look, () => drawGlove(pose.handR
        ? [pose.handR[0], pose.handR[1], pose.handR[2]]
        : [gp[0], a.hr[1], gp[1]], f.ry));
    }
  }

  // umpire
  drawAnimal(-1.55, -4.9, 0, { animal: 'hippo', uni: '#2B3138', trim: '#4A525C', cap: '#1E242A' },
    { armL: 0.5, armR: -0.5, bob: bob * 0.4 }, -0.30);

  // batter (unless already running)
  const batterRunning = G.movers.some((m) => m.from === -1 && m.t >= 0);
  if (!batterRunning) {
    const b = curBatter();
    if (G.hbpT > 0) {                       // just wore one — no bat, on the deck
      drawAnimal(BAT_X + 0.25, BAT_Z - 0.2, -Math.PI / 2, b.look,
        { fall: -0.62, spread: 0.20, legL: -0.35, legR: 0.30,
          armL: -1.7, armR: -1.6, bob: -0.12, helmet: 1 }, 0);
      for (let s2 = 0; s2 < 3; s2++) {
        const a2 = clock * 5 + s2 * 2.1;
        R.b('sphere', BAT_X + 0.25 + Math.cos(a2) * 0.34, 1.05 + Math.sin(clock * 6 + s2) * 0.05,
            BAT_Z - 0.2 + Math.sin(a2) * 0.34, 0.13, 0.13, 0.13, col('#FFE04A'));
      }
    } else {
    const rig = batterRig(G.batSwingT, clock);
    drawAnimal(rig.bx, rig.bz, -Math.PI / 2 + rig.ry, b.look, {
      handL: rig.handTop, handR: rig.handBot, pole: rig.pole,
      legL: rig.lgL, legR: rig.lgR, spread: rig.spread,
      lean: rig.lean, headRy: rig.head,
      helmet: 1, gloveC: bt.trim,
      bob: G.batSwingT < 0 ? bob * 0.5 : 0.015,
    }, 0);
    inked(b.look, () => {
      drawBatRig(rig.grip, rig.dir, BAT_LEN, '#C99A5E', '#6B4A2A');
      drawGrip(rig.grip, rig.dir, rig.botAt, bt.trim);
      drawGrip(rig.grip, rig.dir, rig.topAt, bt.trim);
    });
    }
  }

  // runners in motion
  for (const m of G.movers) {
    if (m.t < 0) continue;
    const r = runnerAt(m);
    if (r.done && m.scored) continue;
    if (m.down > 0) {
      drawAnimal(r.x, r.z, r.ry, m.p.look,
        { fall: -1.45, spread: 0.18, legL: -0.5, legR: 0.4, armL: -1.1, armR: 1.1,
          bob: -0.30, helmet: 1 }, 0);
      for (let s2 = 0; s2 < 3; s2++) {
        const a2 = clock * 5 + s2 * 2.1;
        R.b('sphere', r.x + Math.cos(a2) * 0.34, 0.92 + Math.sin(clock * 6 + s2) * 0.05,
            r.z + Math.sin(a2) * 0.34, 0.13, 0.13, 0.13, col('#FFE04A'));
      }
      continue;
    }
    const sw = r.done ? 0 : Math.sin(clock * 15) * 0.9;
    drawAnimal(r.x, r.z, r.ry, m.p.look, {
      armL: sw * 0.8, armR: -sw * 0.8, legL: sw, legR: -sw, helmet: 1,
      bob: r.done ? 0 : Math.abs(Math.sin(clock * 15)) * 0.07, lean: 0.16,
    }, 0);
  }
  // runners standing on base
  for (let i = 0; i < 3; i++) {
    const p = G.bases[i];
    if (!p || G.movers.some((m) => m.p === p)) continue;
    // he takes his lead down the line, shuffling and watching the pitcher
    const b = BASE_POS[i], n2 = basePt(i + 1);
    const ux = n2[0] - b[0], uz = n2[1] - b[1], ul = Math.hypot(ux, uz) || 1;
    // he only takes his lead before the pitch — once the ball is hit he is
    // back on the bag, watching the fly
    const off = G.phase === 'play' ? 0.25
      : LEAD_OFF + Math.sin(clock * 1.7 + i * 2) * 0.34;
    const lx = b[0] + (ux / ul) * off, lz = b[1] + (uz / ul) * off;
    // he edges down the line but stays squared up to the pitcher
    drawAnimal(lx, lz, Math.atan2(MOUND_POS[0] - lx, MOUND_POS[1] - lz), p.look,
               { armL: 0.42, armR: 0.42, legL: 0.10, legR: -0.10, spread: 0.19,
                 lean: 0.17, bob: bob * 0.6, helmet: 1 }, 0);
  }

  // ball, with a shadow on the ground so its height and distance are readable
  if (G.ball.vis) {
    if (G.phase === 'play' && G.ball.y > 0.28)
      shadow(G.ball.x, G.ball.z, 0.30 * (G.ballBoost || 1), clamp(0.38 - G.ball.y * 0.007, 0.14, 0.38));
    drawTrail(G.trail);
    drawBall(G.ball.x, G.ball.y, G.ball.z, clock * 9);
  }

  // aiming overlay, only while the pitch is live
  if ((G.phase === 'pitch' || G.phase === 'aim') && !G.over) drawZone();

  flushShadows(0);
}

function drawZone() {
  const z = 0.30;
  R.unlit(true, 0.55);
  // two passes: a dark backing then a light face, so the zone reads on grass,
  // asphalt, a white tiled floor and grey regolith alike
  const frame = (c, t, dz, a) => {
    R.gl.uniform1f(R.u.uAlpha, a);
    const seg = (x, y, w, h) => R.b('box', x, y, z + dz, w, h, 0.02, c);
    seg(0, ZY0, ZX * 2 + t, t); seg(0, ZY1, ZX * 2 + t, t);
    seg(-ZX, (ZY0 + ZY1) / 2, t, ZY1 - ZY0); seg(ZX, (ZY0 + ZY1) / 2, t, ZY1 - ZY0);
  };
  frame(col('#141C26'), 0.075, 0.012, 0.5);
  frame(col('#FFFFFF'), 0.035, 0, 0.9);
  // meet cursor
  const a = col('#FFC44D'), ao = col('#5A3B06');
  const rx = G.reticle.x, ry = G.reticle.y;
  for (let i = 0; i < 8; i++) {
    const th = (i / 8) * Math.PI * 2;
    const px = rx + Math.cos(th) * 0.2, py = ry + Math.sin(th) * 0.2;
    R.gl.uniform1f(R.u.uAlpha, 0.55);
    R.b('box', px, py, z - 0.01, 0.105, 0.105, 0.02, ao);
    R.gl.uniform1f(R.u.uAlpha, 0.95);
    R.b('box', px, py, z - 0.03, 0.07, 0.07, 0.02, a);
  }
  R.b('box', rx, ry, z - 0.03, 0.05, 0.05, 0.02, a);
  R.unlit(false);
}

/* ============================================================
   boot
   ============================================================ */
function frame(now) {
  const dt = Math.min(0.05, (now - frame.last || 16) / 1000);
  frame.last = now;
  clock += dt;
  update(dt);
  if (G.st) drawScene();
  else drawIdle();
  requestAnimationFrame(frame);
}
frame.last = 0;

let idleScene = null, idleTeam = null, idleStations = null;
function drawIdle() {
  if (!idleScene) {
    idleScene = STADIUMS[0].build();
    idleTeam = makeTeam(TEAMS[3]);
    idleStations = stationsFor(STADIUMS[0]);
  }
  const st = STADIUMS[0];
  const a = clock * 0.16;
  CAM.ex = Math.sin(a) * 26; CAM.ez = 6 + Math.cos(a) * 26; CAM.ey = 7.5;
  CAM.tx = 0; CAM.ty = 1.2; CAM.tz = 16; CAM.fov = 48;
  R.begin(CAM, { light: st.light, skyTint: st.skyTint, gndTint: st.gndTint, fog: st.fog, fogDist: st.fogDist });
  idleScene.draw();
  const bob = Math.sin(clock * 2.2) * 0.03;
  for (let i = 0; i < 9; i++) {
    const s = idleStations[i];
    drawAnimal(s.x, s.z, Math.atan2(-s.x, -s.z), idleTeam.roster[i].look, { armL: 0.2 + bob, armR: -0.2 - bob, bob }, 0);
  }
  flushShadows(0);
}

function boot() {
  const cv = $('#gl');
  if (!R.init(cv)) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#F6EFE1">' +
      'このブラウザではWebGLが使えないため、ゲームを表示できません。</div>';
    return;
  }
  buildMenus();
  bindInput();
  $('#btn-start').onclick = () => { Snd.boot(); G.mode = 'cpu'; show('#s-stadium'); };
  $('#btn-vs').onclick = () => { Snd.boot(); G.mode = 'vs'; show('#s-stadium'); };
  $('#btn-quit').onclick = () => togglePause();
  $('#btn-resume').onclick = () => togglePause();
  $('#btn-abandon').onclick = () => {
    G.paused = false; G.active = false; G.over = false; G.st = null;
    show('#s-title');
  };
  $('#btn-rules').onclick = () => show('#s-rules');
  $('#btn-rules-back').onclick = () => show('#s-title');
  $('#btn-st-back').onclick = () => show('#s-title');
  $('#btn-tm-back').onclick = () => show('#s-stadium');
  $('#btn-again').onclick = () => { G.st = null; teamPick = 0; show('#s-stadium'); };
  $('#btn-menu').onclick = () => { G.st = null; show('#s-title'); };
  addEventListener('resize', () => R.resize());
  requestAnimationFrame(frame);
}
boot();
</script>
