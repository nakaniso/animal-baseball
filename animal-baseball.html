/* data URIs still decode asynchronously, so the atlas goes up as-is first and
   again once the scans have landed */
function applyFaceScans(cv, done) {
  const keys = Object.keys(FACE_SCANS);
  if (!keys.length) return;
  const g = cv.getContext('2d');
  let left = keys.length;
  for (const k of keys) {
    const bits = k.split(':'), row = FACE_ORDER.indexOf(bits[0]), col = +bits[1];
    const img = new Image();
    img.onload = img.onerror = () => {
      if (img.width && row >= 0) {
        g.clearRect(col * FACE_PX, row * FACE_PX, FACE_PX, FACE_PX);
        g.drawImage(img, col * FACE_PX, row * FACE_PX, FACE_PX, FACE_PX);
      }
      if (--left === 0) done();
    };
    img.src = FACE_SCANS[k];
  }
}

/* uv rect for one cell: [scaleU, scaleV, offsetU, offsetV] */
function faceRect(animal, exp, muz) {
  const row = FACE_ORDER.indexOf(animal);
  if (row < 0) return null;
  const col = (exp || 0) + (muz ? 4 : 0), k = 1 / FACE_N;
  return [k, k, col * k, row * k];
}

/* ============================================================
   The odd ones out.

   Every mammal here is a round cartoon of an animal. These two are the animal:
   their shells come from tools/mesh2js.py, which lofts a salmon through real
   elliptical sections and sweeps a Trypoxylus horn along a curve that forks
   twice. Stacked spheres cannot make either shape.

   Neither has arms, and neither stands still.
     * The salmon has no limbs at all. It flops — in the box, in the field, on
       the base paths — and it hits with its body.
     * The beetle has six legs and hits with its horn. No bat, no glove.

   They keep the shared rig's anchors (torso y+0.74, head y+1.34) so the
   camera, the shadow, knockdowns and slides all still work on them.
   ============================================================ */

/* The flop. A salmon out of water does not stand up — it lies over on its side
   and thrashes, slapping itself clear of the ground every other beat.

   `pitch` is how far it has gone over from upright (about 68 degrees at rest),
   and the body turns about a point partway up rather than about its tail, so
   the nose does not swing a metre across the infield every time it twitches. */
const SAL_PIVOT = 0.60;

function fishFlop(seed) {
  const t = clock * 5.4 + seed;
  const s = Math.sin(t);
  return {
    pitch: 1.19 + s * 0.27,                          // over on its side, whipping
    roll: Math.sin(t * 1.63 + 1.1) * 0.40,           // the sideways snap
    up: Math.max(0, s) * Math.max(0, s) * 0.30,      // and it gets air
    fwd: 0,
  };
}

/* The swing. He has no bat and no arms, so he throws the whole fish at the
   ball: coils up off the dirt, launches, and cartwheels away after contact. */
function fishSwing(st) {
  const u = clamp(st / SWING_LAG, 0, 1);
  const rear = Math.max(0, 1 - u * 2.3);          // the brief coil off the dirt
  const fire = Math.sin(u * Math.PI * 0.5);       // and then all of it at once
  const v = clamp((st - SWING_LAG) / 0.66, 0, 1), w = v * v;
  // Every channel comes back to where the flop rests, and the pitch winds a
  // whole extra turn, so the cartwheel lands in the resting orientation
  // instead of popping. G.batSwingT keeps counting for seconds after the
  // swing, so this has to settle on its own.
  return {
    pitch: 1.19 - rear * 0.44 + fire * 0.50 * (1 - w) + w * Math.PI * 2,
    roll: Math.sin(w * Math.PI) * 2.4 - rear * 0.18,
    up: 0.06 + fire * 0.66 * (1 - w),
    fwd: -rear * 0.32 + fire * 0.92 * (1 - w),
  };
}


/* ---------- 鮭 ---------- */
function drawSalmon(f, A, look, p, y, big) {
  const flank = col(A.fur), back = col(A.back), belly = col(A.fur2);
  const finC = col(A.fin), jaw = col(A.jaw);
  const uni = col(look.uni), trim = col(look.trim);
  const sw = p.swingT;
  const fl = p.fall ? { pitch: 1.50, roll: 0.55, up: 0, fwd: 0 }
    : (sw >= 0 && sw <= SWING_LAG + 0.66 ? fishSwing(sw) : fishFlop(f.ry * 3.1));
  // keep the pivot point on the spot; the rest of the fish swings around it
  const cp = Math.cos(fl.pitch), sp = Math.sin(fl.pitch);
  const by = y + 0.30 + fl.up - SAL_PIVOT * cp;
  const bz = fl.fwd - SAL_PIVOT * sp;
  const rx = fl.pitch + (p.lean || 0), rz = fl.roll;
  const put = (prim, c) => part(f, prim, 0, by, bz, 1, 1, 1, c, rx, rz);

  put('sal_body', flank);
  put('sal_back', back);
  put('sal_belly', belly);
  put('sal_fins', finC);
  put('sal_jaw', jaw);

  // the flush he gets on the run upriver, and the eyes — both solved against
  // the body profile in the baker, so they stay on the surface at any angle
  put('sal_blush', col(A.blush));
  put('sal_eye', col('#D6C489'));
  put('sal_pupil', col('#0E0B09'));

  // team colour, hugging the body: a sphere laid over a fish this narrow just
  // bulges out of it as a ball
  put('sal_band', uni);
  put('sal_collar', trim);
  put('sal_belt', trim);
}

/* ---------- カブトムシ ---------- */

/* The legs. Six of them, and the reason the first six looked like they came
   out of his middle is that they were hung on numbers that looked about right
   — all of them inside the shell. `BEE_LEG` comes out of the baker instead,
   solved against the same profile the wing cases are lofted from, so each one
   starts on the shell however the shell is retuned.

   Each leg is coxa, femur, shin, tarsus. The joint ball at the top is what
   lets the femur swing wide without the leg reading as stuck on, which is
   what stopped the last attempt at pushing them outward.

   The bones are solved against the drop the row actually has to cover, so the
   feet reach the ground from all three anchor heights rather than being three
   hand-tuned lengths that go wrong the moment an anchor moves. */
const BEE_SPLAY = 0.80;             // how far out from the body the femur goes
const BEE_SHIN = [0.10, -0.30];     // and how the shin comes back under him
const BEE_TARS = 0.55;

function beetleLeg(f, A, y, row, sg, sp2, s, legC, ln) {
  const [lx, ly, lz, , rake] = row;
  const jx = s * (lx + sp2), jy = y + ly;
  const fRx = rake + sg * 0.30, fRz = s * BEE_SPLAY;
  const sRx = BEE_SHIN[0] + sg * 0.85, sRz = s * BEE_SHIN[1];
  const tRx = BEE_TARS + sg * 0.40, tRz = s * -0.10;

  // share the drop out among the three bones, then let the shin take up the
  // slack; `ly` is exactly how far the foot has to fall to reach the ground
  const Lf = ly * 0.40, Lt = ly * 0.34;
  const drop = (rx, rz, L) => Math.cos(rx) * Math.cos(rz) * L;
  const Ls = Math.max(0.10, (ly - drop(fRx, fRz, Lf) - drop(tRx, tRz, Lt))
                            / (Math.cos(sRx) * Math.cos(sRz)));

  part(f, 'sphere', jx, jy, lz, 0.105, 0.098, 0.105, legC, ln);   // coxa
  const kn = limb(f, jx, jy, lz, fRx, fRz, Lf, 0.040, legC, null, 0);
  part(f, 'sphere', kn[0], kn[1], kn[2], 0.072, 0.072, 0.072, legC);   // knee
  let an;
  if (row === BEE_LEG[0]) {
    // the front pair digs, so it gets the toothed shin off the baker
    part(f, s < 0 ? 'bee_tibR' : 'bee_tibL', kn[0], kn[1], kn[2],
         1, Ls / 0.30, 1, legC, sRx, sRz);
    an = limbTip(kn[0], kn[1], kn[2], sRx, sRz, Ls);
  } else {
    an = limb(f, kn[0], kn[1], kn[2], sRx, sRz, Ls, 0.030, legC, null, 0);
  }
  part(f, 'sphere', an[0], an[1], an[2], 0.052, 0.052, 0.052, legC);   // ankle
  limb(f, an[0], an[1], an[2], tRx, tRz, Lt, 0.019, legC, legC, 0.046);
}

function drawBeetle(f, A, look, p, y, big) {
  const legC = col(A.leg), horn = col(A.horn);
  const uni = col(look.uni), trim = col(look.trim);
  const ln = p.lean || 0;

  const sw = p.legL || 0, sw2 = p.legR || 0, sp2 = p.spread || 0;
  for (const row of BEE_LEG) for (const s of [-1, 1])
    beetleLeg(f, A, y, row, (s < 0 ? sw : sw2) * row[3], sp2, s, legC, ln);

  // The shell, in three separated values. They were within a shade of each
  // other before, and three brown domes of the same brown read as one lump.
  part(f, 'bee_elytra', 0, y, 0, 1, 1, 1, shade(A.fur, 1.70), ln);
  part(f, 'bee_seam', 0, y, 0, 1, 1, 1, shade(A.fur, 0.60), ln);
  part(f, 'bee_scut', 0, y, 0, 1, 1, 1, shade(A.fur, 0.42), ln);
  part(f, 'bee_prono', 0, y, 0, 1, 1, 1, shade(A.fur, 1.18), ln);
  part(f, 'bee_head', 0, y, 0, 1, 1, 1, shade(A.fur, 1.02), ln);
  part(f, 'bee_horn', 0, y, 0, 1, 1, 1, horn, ln);

  // compound eyes, flat and black and entirely unreadable
  part(f, 'bee_eye', 0, y, 0, 1, 1, 1, col('#120A05'), ln);
  part(f, 'bee_glint', 0, y, 0, 1, 1, 1, col('#93795C'), ln);

  // Team colour: one saddle across the wing cases, and a collar on the shield
  // in the trim rather than the uniform. Three bands of yellow made a wasp of
  // him — the saddle is the jersey and everything else is edging.
  part(f, 'bee_band', 0, y, 0, 1, 1, 1, uni, ln);
  part(f, 'bee_trim', 0, y, 0, 1, 1, 1, trim, ln);
  part(f, 'bee_cband', 0, y, 0, 1, 1, 1, trim, ln);
}

/* pose: { armL, armR, legL, legR, lean, bob, ry } — all radians */
const IDLE = { armL: 0.12, armR: -0.12, legL: 0, legR: 0, lean: 0, bob: 0 };

/* run `draw` once as an ink shell and once as the fill, for species drawn in
   the line-art style */
function inked(look, draw) {
  const A = ANIMALS[look.animal];
  if (A && A.ink && R.inkW === 0) { R.ink(A.ink); draw(); R.ink(0); }
  draw();
}

function drawAnimal(x, z, ry, look, pose, y0) {
  const A = ANIMALS[look.animal];
  if (A.ink && R.inkW === 0) {                  // outline shell first
    R.ink(A.ink);
    drawAnimal(x, z, ry, look, pose, y0);
    R.ink(0);
  }
  const p = pose || IDLE;
  const FC = FACES[look.animal] || null;
  const f = yawFrame(x, z, ry);
  const y = (y0 || 0) + (p.bob || 0);
  if (p.fall) { f.t = p.fall; f.ct = Math.cos(p.fall); f.st = Math.sin(p.fall); f.pivot = y + 0.34; }
  const big = A.big ? 1.12 : 1;
  const fur = col(A.fur), fur2 = col(A.fur2);
  const uni = col(look.uni), trim = col(look.trim), cap = col(look.cap);
  const trim2 = shade(look.trim, 0.72);

  shadow(x, z, (p.fall ? 0.72 : 0.44) * big * (A.shadow || 1), 0.34);

  // legs (local -x is the character's right side, +x their left)
  const sp = p.spread || 0;
  const pant = shade(look.uni, 0.93), shoe = shade(look.cap, 0.66);
  if (!A.body) {                    // the fish has none and the beetle has six
    limb(f, -(0.155 * big + sp), y + 0.44, 0, p.legL || 0, -0.04, 0.36, 0.12, pant, shoe, 0.30, 1);
    limb(f, 0.155 * big + sp, y + 0.44, 0, p.legR || 0, 0.04, 0.36, 0.12, pant, shoe, 0.30, 1);
  }

  // torso
  if (A.body === 'fish') drawSalmon(f, A, look, p, y, big);
  else if (A.body === 'beetle') drawBeetle(f, A, look, p, y, big);
  else if (A.mesh) {
    // the kit is baked as slices of the same profile as the body: laying a
    // sphere over a shaped torso makes it bulge out rather than cover
    const M = A.mesh + '_', ln = p.lean || 0;
    part(f, M + 'body', 0, y + 0.74, 0, 1, 1, 1, uni, ln);
    part(f, M + 'stripe', 0, y + 0.74, 0, 1, 1, 1, shade(look.uni, 0.80), ln);
    part(f, M + 'placket', 0, y + 0.74, 0, 1, 1, 1, trim, ln);
    part(f, M + 'collar', 0, y + 0.74, 0, 1, 1, 1, trim, ln);
    part(f, M + 'belt', 0, y + 0.74, 0, 1, 1, 1, shade(look.cap, 0.85), ln);
  } else {
  part(f, 'sphere', 0, y + 0.74, 0, 0.66 * big, 0.70, 0.56 * big, uni, p.lean || 0);
  part(f, 'sphere', 0, y + 0.97, 0.01, 0.50, 0.14, 0.45, trim);   // jersey collar
  part(f, 'box', 0, y + 0.72, 0.185, 0.075, 0.42, 0.05, trim);  // button placket
  if (A.buttons) for (let i = 0; i < 3; i++)                     // ...and its buttons
    part(f, 'sphere', 0, y + 0.86 - i * 0.145, 0.292 - i * 0.012, 0.058, 0.058, 0.050, trim2);
  // pinstripes down the front, and the belt at the waist
  const stripe = shade(look.uni, 0.80);
  for (const i of [-2, -1, 1, 2]) {
    const px = i * 0.098 * big;
    const k = Math.max(0, 1 - (px / (0.34 * big)) ** 2);
    part(f, 'box', px, y + 0.74, 0.28 * big * Math.sqrt(k) - 0.01, 0.026, 0.34, 0.035, stripe);
  }
  part(f, 'sphere', 0, y + 0.515, 0.02, 0.60 * big, 0.10, 0.50 * big, shade(look.cap, 0.85));
  }

  // arms — either swung by rotation, or aimed at a world-space grip
  const shY = y + 0.94;
  let hl, hr;
  if (A.body) { hl = [x, y + 0.9, z]; hr = [x, y + 0.9, z]; }
  else if (p.handL || p.handR) {
    // reaching arms hang off narrower shoulders and get a longer bone pair, so
    // the front arm can cross the chest to the knob without rubber-banding
    const SH = 0.17 * big, BONE = 0.32;
    const [slx, slz] = L2W(f, -SH, 0);
    const [srx, srz] = L2W(f, SH, 0);
    const poleL = p.pole || [0, -1, 0], poleR = p.pole || [0, -1, 0];
    const hand = p.gloveC ? col(p.gloveC) : fur;
    hl = p.handL
      ? armIK(slx, shY, slz, p.handL[0], p.handL[1], p.handL[2], BONE, BONE, poleL, 0.075, uni,
              p.noPawL ? null : hand)
      : limb(f, -0.33 * big, shY, 0, p.armL || 0, -0.30, 0.34, 0.112, uni, fur, 0.27);
    hr = p.handR
      ? armIK(srx, shY, srz, p.handR[0], p.handR[1], p.handR[2], BONE, BONE, poleR, 0.075, uni,
              p.noPawR ? null : hand)
      : limb(f, 0.33 * big, shY, 0, p.armR || 0, 0.30, 0.34, 0.112, uni,
             p.noPawR ? null : fur, 0.27);
  } else {
    hl = limb(f, -0.33 * big, shY, 0, p.armL || 0, -0.30, 0.34, 0.112, uni,
              p.noPawL ? null : fur, 0.27);
    hr = limb(f, 0.33 * big, shY, 0, p.armR || 0, 0.30, 0.34, 0.112, uni,
              p.noPawR ? null : fur, 0.27);
  }

  // head — may be turned independently of the body (a batter watching the ball)
  const fh = p.headRy ? yawFrame(x, z, ry + p.headRy) : f;
  const hy = y + 1.34;
  const HW = A.hw || 1, HH = A.hh || 1, HD = A.hd || 1;
  const hzF = 0.32 * HD + 0.02;                 // where the front of the face is
  if (A.mesh) part(fh, A.mesh + '_head', 0, hy, 0, 1, 1, 1, fur);   // ears included
  else if (!A.body)
    part(fh, A.head || 'sphere', 0, hy, 0.02, 0.68 * big * HW, 0.66 * HH, 0.64 * big * HD, fur);

  if (A.patch) {                                // panda mask
    for (const s of [-1, 1])
      part(fh, 'sphere', s * 0.17, hy + 0.08, hzF - 0.07, 0.27, 0.29, 0.16, fur2);
  }
  if (A.facePatch) {                            // the penguin's white face
    const fp = A.facePatch;
    part(fh, 'sphere', 0, hy - 0.02, hzF - 0.10, fp[0], fp[1], fp[2], fur2);
  }
  if (A.cheek) {                                // fluffy cheeks
    for (const s of [-1, 1])
      part(fh, 'sphere', s * 0.29, hy - 0.09, 0.09, A.cheek, A.cheek * 0.94, A.cheek * 0.88,
           A.cheekC ? col(A.cheekC) : fur2);
  }

  if (FC && R.atlas && R.inkW === 0) {            // eyes and brows, as art
    R.decal(faceRect(look.animal, p.face || 0, 0));
    const k = 1.015;
    if (A.mesh) {
      // the patch was baked out of the same (azimuth, elevation) map as the
      // skull, so it lies on the surface rather than being fitted to it
      part(fh, A.mesh + '_face', 0, hy, 0, 1, 1, 1, fur);
    } else if (FC.onPatch && A.facePatch) {
      const fp = A.facePatch;                      // the patch stands proud of
      part(fh, 'facep', 0, hy - 0.02, hzF - 0.10,  // the skull, so sit on that
           fp[0] * k, fp[1] * k, fp[2] * k, fur);
    } else {
      part(fh, A.head === 'rbox' ? 'facepr' : 'facep', 0, hy, 0.02,
           0.68 * big * HW * k, 0.66 * HH * k, 0.64 * big * HD * k, fur);
    }
    R.decal(null);
  }

  if (A.mesh) {
    part(fh, A.mesh + '_muz', 0, hy, 0, 1, 1, 1, fur2);     // the pale mask
    part(fh, A.mesh + '_earin', 0, hy, 0, 1, 1, 1, fur2);
    if (FC && !FC.onHead && R.atlas && R.inkW === 0) {
      R.decal(faceRect(look.animal, p.face || 0, 1));
      part(fh, A.mesh + '_snout', 0, hy, 0, 1, 1, 1, fur);
      R.decal(null);
    }
  } else if (A.beak) {
    part(fh, 'cone', 0, hy - 0.045, hzF - 0.03, 0.27, 0.32, 0.27, col(A.beak), -Math.PI / 2);
    part(fh, 'box', 0, hy - 0.045, hzF + 0.07, 0.19, 0.022, 0.16, shade(A.beak, 0.62));
  } else if (A.muz) {
    const mz = A.muz, my = hy + (A.muzY === undefined ? -0.09 : A.muzY);
    const mzz = A.muzZ === undefined ? 0.26 : A.muzZ;
    part(fh, 'sphere', 0, my, mzz, mz[0], mz[1], mz[2], A.muzC ? col(A.muzC) : fur2);
    if (FC && !FC.onHead && R.atlas && R.inkW === 0) {   // nose and mouth, as art
      R.decal(faceRect(look.animal, p.face || 0, 1));
      part(fh, 'facep', 0, my, mzz, mz[0] * 1.03, mz[1] * 1.03, mz[2] * 1.03, fur);
      R.decal(null);
    }
    const nr = A.noseR || 0.11;
    if (!FC && A.nostril) {
      for (const s of [-1, 1])
        part(fh, 'sphere', s * mz[0] * 0.24, my + mz[1] * 0.28, mzz + mz[2] * 0.40,
             nr, nr * 0.90, nr * 0.60, col('#3A3040'));
    } else if (!FC) {
      part(fh, 'sphere', 0, my + mz[1] * 0.40, mzz + mz[2] * 0.40,
           nr, nr * 0.74, nr * 0.72, col(A.noseC || '#33291F'));
    }
    if (!FC && A.whisk) for (const s of [-1, 1]) for (let i = 0; i < 3; i++)
      part(fh, 'box', s * (mz[0] * 0.60 + 0.13), my + 0.02 + (i - 1) * 0.05, mzz + 0.03,
           0.28, 0.017, 0.017, col('#6B5A48'), 0, s * ((i - 1) * 0.24 + 0.05));
  }
  if (A.mouth && !FC) {                         // the frog's wide grin
    for (const s of [-1, 1])
      part(fh, 'box', s * 0.17, hy - 0.16, hzF - 0.02, 0.36, 0.036, 0.07,
           shade(A.fur, 0.42), 0, s * -0.11);
  }

  // eyes, with the drawn brow line above them
  if (A.smallMouth && !FC && R.inkW === 0) {    // a little mouth under the nose
    const mz = A.muz || [0.2, 0.13, 0.16];
    const my2 = hy + (A.muzY === undefined ? -0.09 : A.muzY) + mz[1] * 0.40 - 0.078;
    for (const s of [-1, 1])
      part(fh, 'box', s * 0.038, my2, hzF - 0.062, 0.074, 0.024, 0.05,
           col('#4A3438'), 0, s * 0.30);
  }
  // a species with its own body draws its own eyes, in the mesh
  if (FC || A.body) { /* the eyes live in the face cell, or in the mesh */ }
  else if (!A.noFaceEyes && A.dotEyes) {         // simple dots, as drawn
    const ex = A.eyeX || 0.150, ew = A.eyeW || 0.078, eh = A.eyeH || 0.086;
    if (R.inkW === 0) for (const s of [-1, 1]) {
      part(fh, 'sphere', s * ex, hy + 0.085, hzF - 0.028, ew, eh, 0.070, col(EYE));
      part(fh, 'sphere', s * ex + 0.016, hy + 0.102, hzF - 0.006, 0.021, 0.021, 0.018, col(SHINE));
    }
  } else if (!A.noFaceEyes) {
    const ex = A.eyeX || 0.150, ew = A.eyeW || 0.140, eh = A.eyeH || 0.115;
    const et = A.eyeTilt || 0;
    for (const s of [-1, 1]) {
      part(fh, 'sphere', s * ex, hy + 0.098, hzF - 0.025, ew, eh, 0.085, col('#F6F1E6'), 0, s * et);
      part(fh, 'sphere', s * ex - s * 0.008, hy + 0.094, hzF + 0.012,
           ew * 0.60, eh * 0.74, 0.058, col(EYE), 0, s * et);
      part(fh, 'sphere', s * ex + 0.024, hy + 0.118, hzF + 0.028, 0.034, 0.034, 0.028, col(SHINE));
      if (A.brow)
        part(fh, 'box', s * ex, hy + 0.205, hzF - 0.030, 0.215, 0.040, 0.085,
             shade(A.fur, 0.34), 0, s * 0.16);
    }
  }

  // ears
  const earC = A.earC ? col(A.earC) : fur;
  if (A.ear === 'round') {
    const er = A.earR || 0.26, exx = A.earX || 0.26, eyy = A.earY || 0.26, ed = A.earD || 0.77;
    for (const s of [-1, 1]) {
      part(fh, 'sphere', s * exx, hy + eyy, -0.02, er, er, er * ed, earC);
      part(fh, 'sphere', s * exx, hy + eyy + 0.01, 0.04, er * 0.55, er * 0.55, er * 0.50, fur2);
    }
  }
  if (A.ear === 'point') {
    const er = A.earR || 0.26, exx = A.earX || 0.21, eyy = A.earY || 0.34, tl = A.earT || 0.22;
    for (const s of [-1, 1]) {
      part(fh, 'cone', s * exx, hy + eyy, -0.02, er, er * 1.30, er * 0.76, earC, 0, s * tl);
      part(fh, 'cone', s * exx, hy + eyy - 0.01, 0.035, er * 0.52, er * 0.86, er * 0.42, fur2, 0, s * tl);
      if (A.earTip)
        part(fh, 'cone', s * (exx + er * 0.32), hy + eyy + er * 0.46, -0.02,
             er * 0.60, er * 0.50, er * 0.46, col(A.earTip), 0, s * tl);
    }
  }
  if (A.ear === 'long') {
    const er = A.earR || 0.17, exx = A.earX || 0.15, eyy = A.earY || 0.44;
    const el = A.earLen || 0.56, tl = A.earTilt === undefined ? 0.20 : A.earTilt;
    for (const s of [-1, 1]) {
      part(fh, 'sphere', s * exx, hy + eyy, -0.03, er, el, er * 0.82, fur, 0, s * tl);
      part(fh, 'sphere', s * (exx + 0.010), hy + eyy + 0.02, 0.020,
           er * 0.50, el * 0.80, er * 0.46, A.earIn ? col(A.earIn) : fur2, 0, s * tl);
    }
  }
  if (A.ear === 'toad') {
    const er = A.earR || 0.28, exx = A.earX || 0.19, eyy = A.earY || 0.26;
    const ez = A.earZ === undefined ? 0.05 : A.earZ;
    for (const s of [-1, 1]) {
      part(fh, 'sphere', s * exx, hy + eyy, ez, er, er, er * 0.92, fur);
      part(fh, 'sphere', s * exx, hy + eyy + 0.02, ez + 0.11, er * 0.66, er * 0.66, er * 0.46, col('#F6F1E6'));
      part(fh, 'sphere', s * exx - s * 0.014, hy + eyy + 0.02, ez + 0.15,
           er * 0.34, er * 0.42, er * 0.28, col(EYE));
      part(fh, 'sphere', s * exx + 0.05, hy + eyy + 0.09, ez + 0.17, 0.036, 0.036, 0.030, col(SHINE));
    }
  }
  // tail
  if (A.tail === 'puff') part(f, 'sphere', 0, y + 0.66, -0.30, 0.24, 0.24, 0.24, fur2);
  // the baked torso has a shallower back than the sphere one, so the nub has
  // to be seated further in or it floats off the jersey
  if (A.tail === 'nub') part(f, 'sphere', 0, y + 0.60, A.tailZ || -0.30, 0.16, 0.16, 0.16, fur);
  if (A.tail === 'long') part(f, 'sphere', 0, y + 0.78, -0.36, 0.14, 0.44, 0.14, fur, 0.5);
  if (A.tail === 'bushy') {
    part(f, 'sphere', 0, y + 0.72, -0.38, 0.26, 0.46, 0.26, fur, 0.6);
    part(f, 'sphere', 0, y + 0.94, -0.50, 0.20, 0.20, 0.20, fur2);
  }
  // headwear: a batting helmet at the plate and on the bases, otherwise a cap
  if (p.noHat || A.noHat) { /* a shopper, or a fish — nothing to hang a cap on */ }
  else if (p.helmet) {
    const cy = A.capY || 0, cs = A.capS || 1;
    part(fh, 'dome', 0, hy + 0.27 * cs + cy, 0.01, 0.80 * big * cs, 0.44 * cs, 0.78 * big * cs, cap);
    part(fh, 'sphere', 0, hy + 0.285 * cs + cy, 0.01, 0.80 * big * cs, 0.22 * cs, 0.78 * big * cs, cap);
    part(fh, 'box', 0, hy + 0.265 * cs + cy, 0.34 * cs, 0.50 * cs, 0.075 * cs, 0.26 * cs, cap);
    // the flap covers the ear turned toward the pitcher (local +x)
    part(fh, 'sphere', 0.335 * big * cs, hy + 0.12 * cs + cy, 0.02,
         0.14 * cs, 0.32 * cs, 0.40 * cs, cap);
    part(fh, 'box', 0, hy + 0.40 * cs + cy, 0.10 * cs, 0.09 * cs, 0.06 * cs, 0.60 * cs, trim);
  } else {
    const cy = A.capY || 0, cs = A.capS || 1;
    part(fh, 'dome', 0, hy + 0.29 * cs + cy, 0.01 * cs, 0.74 * big * cs, 0.38 * cs, 0.70 * big * cs, cap);
    part(fh, 'box', 0, hy + 0.283 * cs + cy, 0.31 * cs, 0.46 * cs, 0.07 * cs, 0.30 * cs, cap);
    part(fh, 'sphere', 0, hy + 0.46 * cs + cy, 0.01, 0.09 * cs, 0.09 * cs, 0.09 * cs, trim);
  }

  return { f, hl, hr, hy, y };
}

/* A bat to real proportions: 2.5cm handle, a taper, a 6.5cm barrel, knob at the
   bottom. `grip` is where the bottom hand sits, `dir` points at the barrel. */
function drawBatRig(grip, dir, len, wood, tape) {
  const P = (t) => [grip[0] + dir[0] * t, grip[1] + dir[1] * t, grip[2] + dir[2] * t];
  const w = col(wood), g = col(tape);
  const knob = P(-0.055), hEnd = P(0.34), taper = P(0.60), tip = P(len);
  R.seg('cyl', knob[0], knob[1], knob[2], hEnd[0], hEnd[1], hEnd[2], 0.017, g);
  R.seg('taper', taper[0], taper[1], taper[2], hEnd[0], hEnd[1], hEnd[2], 0.033, w);
  R.seg('cyl', taper[0], taper[1], taper[2], tip[0], tip[1], tip[2], 0.033, w);
  R.b('sphere', tip[0], tip[1], tip[2], 0.070, 0.070, 0.070, w);
  const k2 = P(-0.02);
  R.seg('cyl', knob[0], knob[1], knob[2], k2[0], k2[1], k2[2], 0.031, g);
}

/* the two fists wrapped around the handle */
function drawGrip(grip, dir, at, c) {
  const P = (t) => [grip[0] + dir[0] * t, grip[1] + dir[1] * t, grip[2] + dir[2] * t];
  const a = P(at - 0.055), b = P(at + 0.055);
  R.seg('sphere', a[0], a[1], a[2], b[0], b[1], b[2], 0.082, col(c));
}

/* A fielder's mitt: palm, four finger ridges, a thumb and the web between
   them. All one leather; the shape does the work, not a painted pocket. */
function drawGlove(pt, ry) {
  if (!pt) return;
  const a = ry || 0, fx = Math.sin(a), fz = Math.cos(a);
  const sx = fz, sz = -fx;                       // across the mitt
  const x = pt[0] + fx * 0.05, y = pt[1], z = pt[2] + fz * 0.05;
  const hide = col('#7A4A22'), dark = col('#46280F'), web = col('#9A6B38');
  R.d('rbox', x, y - 0.02, z, 0, a, 0, 0.38, 0.36, 0.20, hide);          // palm
  for (let i = -1; i <= 2; i++)                                          // fingers
    R.d('rbox', x + sx * i * 0.083, y + 0.20, z + sz * i * 0.083, 0, a, 0,
        0.072, 0.22, 0.18, hide);
  R.d('rbox', x - sx * 0.235, y - 0.03, z - sz * 0.235, 0, a, 0, 0.11, 0.30, 0.19, hide);
  R.d('rbox', x - sx * 0.145, y + 0.18, z - sz * 0.145, 0, a, 0, 0.11, 0.20, 0.16, web);
  R.d('rbox', x + fx * 0.075, y - 0.05, z + fz * 0.075, 0, a, 0, 0.20, 0.18, 0.05, dark);
  R.d('rbox', x, y - 0.22, z, 0, a, 0, 0.32, 0.10, 0.18, dark);          // heel
}

/* ---------- the ball ---------- */
const BALL_R = 0.14;
/* a real ball is a speck at 80m — grow it with distance so the player can
   always follow the flight */
function ballScale(x, y, z) {
  const d = Math.hypot(x - R.eye[0], y - R.eye[1], z - R.eye[2]);
  // Nearly true perspective: the compensation is small enough that the ball
  // visibly shrinks as it flies away, which is the whole depth cue.
  return BALL_R * 2 * clamp(Math.pow(d / 12, 0.15), 1, 1.5) * (G.ballBoost || 1);
}
function drawBall(x, y, z, spin) {
  const s = ballScale(x, y, z);
  R.b('sphere', x, y, z, s, s, s, col('#FBF7EC'));
  R.d('cyl', x, y, z, Math.PI / 2, spin || 0, 0, s * 0.78, s * 0.25, s * 0.78, col('#D9402E'));
}
function drawTrail(tr) {
  for (let i = 0; i < tr.length; i += 3) {
    const k = 1 - i / tr.length;
    const s = ballScale(tr[i], tr[i + 1], tr[i + 2]) * 0.72 * k * k;
    if (s < 0.012) continue;
    R.b('sphere', tr[i], tr[i + 1], tr[i + 2], s, s, s, col('#FFE9B0'));
  }
}

/* Build a 9-man roster with a batting order and fielding positions. */
function makeTeam(def) {
  const names = NAME_POOL[def.animal].slice();
  const order = ['CF', 'SS', 'RF', '1B', 'LF', '3B', 'C', '2B', 'P'];
  const roster = order.map((posK, i) => {
    const v = (s, spread) => clamp(s / 5 + rnd(-spread, spread), 0.12, 1.0);
    return {
      name: names[i], no: i + 1, pos: posK,
      look: { animal: def.animal, uni: def.uni, trim: def.trim, cap: def.cap },
      power: v(def.pow, 0.14), contact: v(def.con, 0.14), speed: v(def.spd, 0.12), defense: v(def.def, 0.12),
      arm: (def.arm || 3) / 5,
      ab: 0, h: 0, hr: 0, rbi: 0, k: 0, bb: 0, hbp: 0,
    };
  });
  // the pitcher bats ninth but is the best arm
  roster[8].arm = clamp((def.arm || 3) / 5 + 0.18, 0, 1);
  roster[8].power = clamp(roster[8].power - 0.22, 0.1, 1);
  roster[8].contact = clamp(roster[8].contact - 0.18, 0.1, 1);
  return { def, name: def.name, roster, animal: def.animal, uni: def.uni, trim: def.trim, cap: def.cap };
}

function gauss(sd) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * sd;
}

  batSwingT: -1, bunting: false, pitchType: 0,
  fielders: [], movers: [], flight: null, chase: null,
  camMode: 'bat', lastText: '', mode: 'cpu', paused: false, playScript: null, traffic: null, carStall: 0,
  firstPitch: false, ballBoost: 1,
  innings: 6, hbpT: 0,
};

const batTeam = () => (G.half === 0 ? G.away : G.home);
const fldTeam = () => (G.half === 0 ? G.home : G.away);
const userBatting = () => (G.half === 0 ? 0 : 1) === G.userSide;
/* who is at the controls right now */
const humanBats = () => (G.mode === 'vs' ? true : G.mode === 'auto' ? false : userBatting());
const humanPitches = () => (G.mode === 'vs' ? true : G.mode === 'auto' ? false : !userBatting());
/* 1P is always the away side */
const battingPlayer = () => (G.half === 0 ? '1P' : '2P');
const pitchingPlayer = () => (G.half === 0 ? '2P' : '1P');
const curBatter = () => batTeam().roster[G.order[G.half]];
const curPitcher = () => fldTeam().roster[8];
const basePt = (i) => (i < 0 || i >= 3 ? HOME_POS : BASE_POS[i]);
const DUGOUT = [-25.5, 2.0];   // the bench, first-base side in foul ground

/* ============================================================
   setup
   ============================================================ */
function startGame(stadiumId, awayTeamId, homeTeamId) {
  const st = stadiumById(stadiumId);
  G.st = st;
  G.stations = stationsFor(st);
  G.scene = st.build();
  const others = TEAMS.filter((t) => t.id !== awayTeamId);
  G.away = makeTeam(teamById(awayTeamId));
  G.home = makeTeam(homeTeamId ? teamById(homeTeamId) : pick(others));
  G.userSide = 0;
  G.inning = 1; G.half = 0; G.outs = 0; G.balls = 0; G.strikes = 0;
  G.bases = [null, null, null];
  G.score = [0, 0]; G.lines = [[], []]; G.order = [0, 0];
  G.hits = [0, 0]; G.errs = [0, 0]; G.lob = [0, 0]; G.inningRuns = 0;
  G.over = false; G.active = true; G.paused = false; G.movers = []; G.flight = null; G.playScript = null;
  G.firstPitch = true;
  // start already looking down the barrel instead of swinging in from the menu
  CAM.ex = 0.55; CAM.ey = 4.6; CAM.ez = -9.0; CAM.tx = 0; CAM.ty = 0.4; CAM.tz = 7.0; CAM.fov = 40;
  CAM.wx = CAM.ex; CAM.wy = CAM.ey; CAM.wz = CAM.ez;
  G.fielders = G.stations.map((s) => ({ st: s, x: s.x, z: s.z, tx: s.x, tz: s.z, ry: Math.PI, run: 0, hold: false, down: 0, dvz: 0, dodge: 0 }));
  G.traffic = makeTraffic(st);
  uiTeams();
  clearLog();
  logLine(`${G.st.name}での試合です。${G.away.name} 対 ${G.home.name}。`, true);
  logLine(`ルール：${G.st.quirk}`);
  nextBatter();
}

function setPhase(p, len) {
  if (G.phase === 'play' && p !== 'play') flushResult();
  G.phase = p; G.pt = 0; G.phaseLen = len || 0;
}

function nextBatter() {
  G.balls = 0; G.strikes = 0;
  G.swingT = -1; G.contactAt = -1; G.decided = null; G.batSwingT = -1; G.bunting = false;
  G.reticle.x = 0; G.reticle.y = 0.88;
  G.ball.vis = false; G.trail.length = 0;
  G.camMode = 'bat';
  placeFielders();
  uiScore();                       // the pips belong to this batter, not the last
  uiBatter();
  setPhase('ready', G.firstPitch ? 3.0 : 1.5);
}

function placeFielders() {
  for (const f of G.fielders) { f.tx = f.st.x; f.tz = f.st.z; f.hold = false; }
}

/* traffic keeps rolling whatever the game is doing */
function updateTraffic(dt) {
  if (!G.traffic) return;
  stepTraffic(G.traffic, dt);
  for (const f of G.fielders) {
    if (f.down > 0) { f.down -= dt; f.z += f.dvz * dt; f.dvz *= 0.90; continue; }
    if (f.dodge > 0) { f.dodge -= dt; continue; }   // just got out of the way
    if (f.scripted) continue;            // he is on the play; leave him to it
    for (const c of G.traffic) {
      if (carHits(c, f.x, 0.6, f.z, 0.30)) {
        if (!chance(c.walk ? 0.20 : 0.13)) { f.dodge = 1.3; break; }  // he skips clear
        f.down = c.walk ? 1.4 : 2.0;
        f.dvz = Math.sign(c.vz) * (c.walk ? 2.0 : 6.0);
        Snd.crash();
        logLine(c.walk ? `${f.st.sn}が買い物客とぶつかって転倒！`
                       : `${f.st.sn}が車にはねられた！`, true);
        break;
      }
    }
  }
}

/* A runner flattened between the bags never gets there: he is out, and any run
   he was in the middle of scoring comes back off the board. */
function runOverRunner(m, walk) {
  if (m.retired) return;
  m.retired = true;
  for (let i = 0; i < 3; i++) if (G.bases[i] === m.p) G.bases[i] = null;
  if (m.scored) {
    G.score[G.half] = Math.max(0, G.score[G.half] - 1);
    G.inningRuns = Math.max(0, G.inningRuns - 1);
    if (m.rbiOwner) m.rbiOwner.rbi = Math.max(0, m.rbiOwner.rbi - 1);
    m.scored = false;
  }
  if (G.outs < 3) G.outs++;
  banner(walk ? `${m.p.name} 買い物客と衝突\nアウト！` : `${m.p.name} 車にはねられ\nアウト！`, true);
  logLine(walk ? `${m.p.name}が買い物客とぶつかってアウト！` : `${m.p.name}が車にはねられてアウト！`, true);
  uiScore();
}

/* ============================================================
   pitching
   ============================================================ */
function cpuPitchChoice() {
  const p = curPitcher();
  const behind = G.balls >= 2 && G.strikes < 2;
  const ahead = G.strikes === 2 || (G.strikes > G.balls);
  let ti = 0;
  if (behind) ti = chance(0.7) ? 0 : rint(1, 4);
  else if (ahead) ti = chance(0.72) ? rint(1, 4) : 0;
  else ti = rint(0, 4);
  // aim: ahead in the count -> chase pitch just off the plate
  const wide = ahead && chance(0.55);
  const ax = clamp(gauss(wide ? 0.44 : 0.36) + (wide ? (chance(0.5) ? 0.34 : -0.34) : 0), -0.85, 0.85);
  const ay = clamp(0.88 + gauss(wide ? 0.40 : 0.34) + (wide ? -0.18 : 0), 0.20, 1.66);
  const acc = 0.62 + p.arm * 0.38;
  let fx = ax + gauss((1 - acc) * 0.30), fy = ay + gauss((1 - acc) * 0.28);
  if (chance(0.10)) { fx += gauss(0.40); fy += gauss(0.38); }   // he misses his spot
  return { ti, ax: fx, ay: fy };
}

function throwPitch(ti, ax, ay) {
  const p = curPitcher();
  const P = PITCHES[ti];
  // no two pitches come out quite the same
  const spd = P.spd * (0.90 + p.arm * 0.16) * (1 + gauss(0.040));
  const T = 18.15 / spd;
  const slip = (1 - p.arm) * 0.11;             // even his own aim drifts a little
  const bx = P.bx * (1 + gauss(0.20)), by = P.by * (1 + gauss(0.20));
  const arrive = { x: clamp(ax + gauss(slip), -0.95, 0.95),
                   y: clamp(ay + gauss(slip), 0.22, 1.68) };
  const pf = G.fielders[0];
  G.pitch = {
    P, T, t: 0, ti, bx, by,
    x0: (pf ? pf.x : 0) + 0.46, y0: 1.92, z0: (pf ? pf.z : MOUND_POS[1]) - 0.16,
    tx: arrive.x - bx, ty: arrive.y - by,
    ax: arrive.x, ay: arrive.y,
    inZone: Math.abs(arrive.x) <= ZX + 0.05 && arrive.y >= ZY0 - 0.05 && arrive.y <= ZY1 + 0.05,
    // way inside and at body height: it is going to hit him unless he spins away
    hbp: arrive.x > 0.80 && arrive.y > 0.18 && arrive.y < 1.58 && chance(0.12),
  };
  G.swingT = -1; G.contactAt = -1; G.decided = null; G.batSwingT = -1;
  G.ball.vis = true; G.trail.length = 0; G.firstPitch = false;
  // in two-player games the hitter re-aims from scratch each pitch
  if (G.mode === 'vs') { G.reticle.x = 0; G.reticle.y = 0.88; }
  if (!humanBats()) cpuBatterDecide();
  Snd.blip();
  setPhase('pitch');
  if (G.mode === 'vs') uiHint();   // controls hand over to the hitter
}

function pitchPos(pc, t) {
  const u = clamp(t / pc.T, 0, 1.6);
  const k = Math.pow(Math.min(u, 1), pc.P.pw);
  return {
    x: lerp(pc.x0, pc.tx, u) + pc.bx * k,
    y: lerp(pc.y0, pc.ty, u) + pc.by * k - (u > 1 ? (u - 1) * 0.5 : 0),
    z: lerp(pc.z0, 0.15, u),
  };
}

function cpuBatterDecide() {
  const b = curBatter(), pc = G.pitch;
  const eye = 0.34 + b.contact * 0.5;
  let sw;
  if (pc.inZone) sw = chance(0.42 + eye * 0.32 + G.strikes * 0.09);
  else {
    const close = Math.abs(pc.ax) < ZX + 0.28 && pc.ay > ZY0 - 0.28 && pc.ay < ZY1 + 0.28;
    sw = chance((close ? 0.34 : 0.09) + (G.strikes === 2 ? (close ? 0.40 : 0.14) : 0) - eye * 0.12);
  }
  if (!sw) return;
  const jitter = 1.75 - b.contact * 0.65;
  G.swingT = pc.T - SWING_LAG + gauss(0.062 * jitter);
  G.cpuAim = {
    x: pc.ax + gauss(0.22 * jitter),
    y: pc.ay + gauss(0.20 * jitter),
  };
}

/* ============================================================
   the swing
   ============================================================ */
function playerSwing(bunt) {
  if (G.phase !== 'pitch' || G.swingT >= 0 || !humanBats()) return;
  G.swingT = G.pitch.t;
  G.bunting = !!bunt;
  G.batSwingT = 0;
  judgeSwing();
}

function judgeSwing() {
  const pc = G.pitch, b = curBatter();
  const contactT = G.swingT + SWING_LAG;
  const dt = contactT - pc.T;
  const aim = humanBats() ? G.reticle : G.cpuAim;
  const err = Math.hypot(pc.ax - aim.x, (pc.ay - aim.y) * 1.05);
  const tw = TIME_WIN * (0.80 + b.contact * 0.42) * (G.bunting ? 1.7 : 1);
  const mw = MEET_WIN * (0.80 + b.contact * 0.42) * (G.bunting ? 1.5 : 1);
  if (Math.abs(dt) > tw || err > mw) { G.decided = { miss: true }; return; }
  const qT = 1 - Math.abs(dt) / tw, qM = 1 - err / mw;
  const q = clamp(qT * 0.56 + qM * 0.44, 0, 1);
  G.decided = { miss: false, q, dt, err, dy: pc.ay - aim.y };
  G.contactAt = Math.max(contactT, pc.T * 0.97);
}

/* ============================================================
   ball flight simulation
   ============================================================ */
/* a snapshot of the traffic, advanced with the ball so the carom is part of
   the same simulation the ruling is read from */
function carsSnapshot() {
  return (G.traffic || []).map((c) => ({ x: c.x, z0: c.z, vz: c.vz, hw: c.hw, hh: c.hh, hl: c.hl }));
}

function simFlight(v0, laDeg, dirDeg, st) {
  const la = laDeg * DEG, dir = dirDeg * DEG;
  let x = BAT_X - 0.80, y = 1.05, z = BAT_Z + 0.17;
  const vh = v0 * Math.cos(la);
  let vx = vh * Math.sin(dir), vz = vh * Math.cos(dir), vy = v0 * Math.sin(la);
  const path = [];
  const cars = carsSnapshot();
  let carHit = 0;
  let t = 0, hr = false, ceilHit = false, apex = y, hang = 0, bounced = 0, groundIdx = -1;
  const dt = 1 / 90, drag = 0.0019;
  const wallTest = () => {
    const d = Math.hypot(x, z), a = angOf(x, z);
    if (Math.abs(a) > 50) return 0;
    const fd = fenceAt(st, a);
    if (d >= fd) return y > st.fenceH ? 2 : 1;
    return 0;
  };
  while (t < 11) {
    const sp = Math.hypot(vx, vy, vz);
    const k = drag * sp;
    vx -= vx * k * dt; vz -= vz * k * dt;
    vy -= (st.gravity + vy * k) * dt;
    x += vx * dt; y += vy * dt; z += vz * dt; t += dt;
    if (y > apex) apex = y;
    if (st.ceiling && y > st.ceiling - BALL_R && !ceilHit) {
      ceilHit = true; y = st.ceiling - BALL_R; vy = -Math.abs(vy) * 0.32; vx *= 0.6; vz *= 0.6;
    }
    if (y <= BALL_R) {
      if (!hang) hang = t;
      if (groundIdx < 0) groundIdx = path.length;
      y = BALL_R;
      if (bounced < 6 && Math.abs(vy) > 0.9) { vy = -vy * 0.36; vx *= 0.82; vz *= 0.82; bounced++; }
      else { vy = 0; vx -= vx * 1.15 * dt; vz -= vz * 1.15 * dt; }  // rolling friction
      if (Math.hypot(vx, vz) < 0.6) { path.push({ x, y, z, t }); break; }
    }
    if (carHit < 3) {
      for (const c of cars) {
        const cz = c.z0 + c.vz * t;
        if (Math.abs(x - c.x) >= c.hw + BALL_R || Math.abs(z - cz) >= c.hl + BALL_R || y >= c.hh + BALL_R) continue;
        const px = (c.hw + BALL_R) - Math.abs(x - c.x);
        const pz = (c.hl + BALL_R) - Math.abs(z - cz);
        const py = (c.hh + BALL_R) - y;
        if (py <= px && py <= pz) {                       // off the roof
          y = c.hh + BALL_R; vy = Math.abs(vy) * 0.45 + 2.2; vz += c.vz * 0.25;
        } else if (px < pz) {                             // off the flank
          const s2 = Math.sign(x - c.x) || 1;
          x = c.x + s2 * (c.hw + BALL_R);
          vx = s2 * (Math.abs(vx) * 0.55 + 3.5); vz += c.vz * 0.35; vy = Math.abs(vy) * 0.4 + 1.2;
        } else {                                          // off the nose or tail
          const s2 = Math.sign(z - cz) || 1;
          z = cz + s2 * (c.hl + BALL_R);
          vz = s2 * (Math.abs(vz) * 0.5 + 2.0) + c.vz * 0.55; vy = Math.abs(vy) * 0.4 + 1.5;
        }
        carHit++; groundIdx = groundIdx < 0 ? -1 : groundIdx;
        break;
      }
    }
    const w = st.fenceH > 0 ? wallTest() : 0;
    if (w === 2) { hr = true; path.push({ x, y, z, t }); break; }
    if (w === 1) { vx *= -0.32; vz *= -0.32; x += vx * dt * 2; z += vz * dt * 2; }
    path.push({ x, y, z, t });
  }
  if (!hang) hang = t;
  // where it first comes down — that is what fielders play
  let land = { x, z }, landT = t;
  for (const p of path) if (p.y <= BALL_R + 0.05) { land = { x: p.x, z: p.z }; landT = p.t; break; }
  const a = angOf(land.x, land.z);
  return {
    path, hang: landT, apex, hr, ceilHit, la: laDeg, dir: dirDeg, v0,
    groundIdx: groundIdx < 0 ? path.length : groundIdx, carHit,
    land, dist: Math.hypot(land.x, land.z), ang: a,
    finalDist: Math.hypot(x, z), finalX: x, finalZ: z, total: t,
    foul: Math.abs(a) > 45,
  };
}

/* ============================================================
   turning a batted ball into a baseball outcome
   ============================================================ */
const fielderOf = (team, k) => team.roster.find((r) => r.pos === k) || team.roster[0];

/* The first moment a fielder starting at (sx,sz) can put a glove on the ball.
   Only points below jumping height count, and he needs time to get there. */
function interceptOn(fl, sx, sz, spd) {
  const path = fl.path;
  for (let i = 0; i < path.length; i++) {
    const q = path[i];
    if (q.y > 2.6) continue;                       // still over his head
    const reach = 0.9 + spd * Math.max(0, q.t - 0.35) * 0.88;
    if (Math.hypot(q.x - sx, q.z - sz) <= reach)
      return { i, t: q.t, p: q, air: i < fl.groundIdx };
  }
  const i = path.length - 1;
  return { i, t: path[i].t, p: path[i], air: false, late: true };
}

/* transfer + throw, with a cut-off man on anything long */
function throwTime(from, tx, tz, arm) {
  const d = Math.hypot(from.x - tx, from.z - tz);
  return 0.55 + d / (27 + (arm || 0.6) * 13) + (d > 42 ? 1.05 : 0);
}

const LEAD_OFF = 2.6;              // how far a runner edges off the bag

/* seconds from contact for a runner to reach base n (1 = first) */
function baseTime(p, n) {
  const first = 27.43 / (5.6 + p.speed * 1.7);   // 4.9s slow .. 3.8s quick
  const rest = 27.43 / (7.6 + p.speed * 2.2);
  return first + (n - 1) * rest + (n > 1 ? 0.25 : 0);
}

/* which fielder covers a bag for the throw; if he is the one who fielded the
   ball, the usual back-up takes it instead */
const BACKUP = { '1B': 'P', '2B': 'SS', '3B': 'P', C: 'P', SS: '2B' };
function coverFor(tx, tz, busy) {
  const near = (b) => dist2(tx, tz, b[0], b[1]) < 1.5;
  const want = near(BASE_POS[0]) ? '1B' : near(BASE_POS[1]) ? '2B'
    : near(BASE_POS[2]) ? '3B'
    : dist2(tx, tz, HOME_POS[0], HOME_POS[1]) < 2.5 ? 'C' : null;
  if (!want) {
    // not a bag — a lob back to the mound, a cut-off. The nearest infielder
    // takes it; the catcher never leaves the plate to chase a throw.
    let bi = -1, bd = 1e9;
    for (let i = 0; i < G.stations.length; i++) {
      const s = G.stations[i];
      if (s.k === 'C' || !s.infield || i === busy) continue;
      const d = dist2(tx, tz, s.x, s.z);
      if (d < bd) { bd = d; bi = i; }
    }
    return bi;
  }
  let i = G.stations.findIndex((s) => s.k === want);
  if (i === busy && BACKUP[want]) i = G.stations.findIndex((s) => s.k === BACKUP[want]);
  return i;
}
const stationIdx = (k) => G.stations.findIndex((s) => s.k === k);

/* the ball squirts out of the glove and he has to go and get it */
const FUMBLE_T = 0.66;
function fumble(play, P) {
  const a = rnd(0, Math.PI * 2), d = rnd(2.2, 3.6);
  play.fumble = 1;
  play.fumbleTo = [P.x + Math.cos(a) * d, P.z + Math.sin(a) * d];
}

/* An outfielder never throws straight at the pitcher: the ball comes in
   through the cut-off man, who meets it on the line the ball came down on. */
function relayIn(play, fl, P, arm, fidx) {
  const d0 = Math.hypot(P.x, P.z) || 1;
  const rr = clamp(d0 * 0.55, 20, 40);
  const rx = (P.x / d0) * rr, rz = (P.z / d0) * rr;
  let cutK = fl.ang > 0 ? 'SS' : '2B';
  if (stationIdx(cutK) === fidx) cutK = cutK === 'SS' ? '2B' : 'SS';
  const ci = stationIdx(cutK);
  play.throwTo = [rx, rz];
  play.throwDur = throwTime(P, rx, rz, arm);
  if (ci >= 0 && ci !== fidx)
    play.moves.push({ idx: ci, x: rx, z: rz, byT: play.cutT + play.throwDur });
}

/* A pop-up into foul ground is an out if somebody can camp under it. Anything
   hit flat down the line, or hooking back into the seats, stays a plain foul.
   The middle infielders and the centre fielder never get there. */
function foulCatch(fl) {
  if (fl.la < 32 || fl.hang < 1.5) return null;
  const d = Math.hypot(fl.land.x, fl.land.z);
  if (d > 30) return null;                        // into the crowd
  if (Math.abs(fl.ang) > 95 && d > 15) return null;   // over the backstop
  const st = G.st, def = fldTeam();
  let best = null;
  for (let i = 0; i < G.stations.length; i++) {
    if (G.fielders[i] && G.fielders[i].down > 0) continue;
    const s = G.stations[i];
    if (s.k === '2B' || s.k === 'SS' || s.k === 'CF') continue;
    const pl = fielderOf(def, s.k);
    const spd = 6.0 * st.fielderSpeed * (0.86 + pl.defense * 0.28) * (s.k === 'C' ? 1.10 : 1);
    const fx = G.fielders[i] ? G.fielders[i].x : s.x;
    const fz = G.fielders[i] ? G.fielders[i].z : s.z;
    const it = interceptOn(fl, fx, fz, spd);
    if (!it.air) continue;                        // he has to get under it
    if (!best || it.t < best.it.t) best = { i, s, pl, it };
  }
  if (!best) return null;
  // it is a harder play than a routine fly: on the run, near the screen
  if (!chance(0.66)) return null;
  const P = best.it.p;
  const play = { fidx: best.i, cutIdx: best.it.i, cutT: best.it.t,
                 pt: { x: P.x, y: P.y, z: P.z }, air: true,
                 infield: !!best.s.infield, moves: [] };
  if (best.s.infield) { play.throwTo = null; play.throwDur = 0; }
  else relayIn(play, fl, P, best.pl.arm, best.i);
  return { kind: 'flyout', outs: 1, fielder: best.s, play, canSac: false, foulFly: 1,
           text: `ファウルフライ\n${best.s.sn}がつかんだ！` };
}

function fieldBall(fl) {
  const st = G.st, bat = curBatter(), def = fldTeam();

  if (fl.foul) return foulCatch(fl) || { kind: 'foul', text: 'ファウル' };
  if (fl.hr) {
    const far = fl.finalDist > fenceAt(st, fl.ang) * 1.22;
    return { kind: 'hr', bases: 4, big: true,
      text: far ? 'ホームラン！\n特大の一発だ' : 'ホームラン！' };
  }
  if (fl.ceilHit && st.ceiling && fl.dist >= fenceAt(st, fl.ang) * 0.94)
    return { kind: 'ground_rule', bases: 2, hit: true, text: '天井に当たった！\nエンタイトルツーベース' };
  if (st.fenceH === 0 && fl.dist >= fenceAt(st, fl.ang) && fl.la >= 14)
    return { kind: 'hr', bases: 4, big: true, text: 'ホームラン！\n川まで届いた' };

  /* who actually gets to it first */
  let best = null;
  const rest = fl.path[fl.path.length - 1];
  for (let i = 0; i < G.stations.length; i++) {
    if (G.fielders[i] && G.fielders[i].down > 0) continue;   // flattened by a car
    const s = G.stations[i], pl = fielderOf(def, s.k);
    // a pitcher fields comebackers and bunts, not gaps
    const spd = 6.0 * st.fielderSpeed * (0.86 + pl.defense * 0.28) * (s.k === 'P' ? 0.72 : 1);
    const fx = G.fielders[i] ? G.fielders[i].x : s.x;
    const fz = G.fielders[i] ? G.fielders[i].z : s.z;
    const it = interceptOn(fl, fx, fz, spd);
    // if nobody could cut it off, whoever is nearest where it stops goes and
    // gets it — otherwise the tie always fell to the pitcher
    const key = it.late ? 1e5 + dist2(fx, fz, rest.x, rest.z) : it.t;
    if (!best || key < best.key) best = { i, s, pl, spd, it, key };
  }
  let downNote = '';
  {
    let nd = null;
    for (let i = 0; i < G.stations.length; i++) {
      const st2 = G.stations[i], d = dist2(st2.x, st2.z, fl.land.x, fl.land.z);
      if (!nd || d < nd.d) nd = { i, d, sn: st2.sn };
    }
    if (nd && G.fielders[nd.i] && G.fielders[nd.i].down > 0 && nd.d < 22)
      downNote = `${nd.sn}が倒れている！\n`;
  }
  if (!best) {   // everybody is down — the ball just sits there
    const q = fl.path[fl.path.length - 1];
    return { kind: 'hit', bases: 3, hit: true, text: '誰も追いつけない！\nスリーベース',
             play: { fidx: 0, cutIdx: fl.path.length - 1, cutT: q.t,
                     pt: { x: q.x, y: q.y, z: q.z }, air: false, infield: false,
                     coverIdx: -1 } };
  }
  const P = best.it.p;
  const errP = clamp((1 - best.pl.defense) * 0.05
    + (st.id === 'market' ? 0.03 : 0) + (st.id === 'road' ? 0.025 : 0), 0, 0.13);
  const play = { fidx: best.i, cutIdx: best.it.i, cutT: best.it.t,
                 pt: { x: P.x, y: P.y, z: P.z }, air: best.it.air,
                 infield: !!best.s.infield, moves: [] };
  /* someone has to be standing on the bag when the throw gets there */
  const sendTo = (bx, bz, fromPt, arm, after) => {
    const dur = throwTime(fromPt, bx, bz, arm);
    const ci = coverFor(bx, bz, play.fidx);
    if (ci >= 0 && ci !== play.fidx) {
      const st2 = G.stations[ci];
      const isC = st2.k === 'C';               // he sets up just behind the plate
      const tx2 = isC ? 0 : bx, tz2 = isC ? -1.1 : bz;
      // never drag someone clear across the diamond to take a routine lob
      if (dist2(st2.x, st2.z, tx2, tz2) < 34)
        play.moves.push({ idx: ci, x: tx2, z: tz2, byT: (after || play.cutT) + dur });
    }
    return dur;
  };
  const aimAt = (bx, bz) => {
    play.throwTo = [bx, bz];
    play.throwDur = sendTo(bx, bz, P, best.pl.arm);
  };

  /* ---- caught on the fly ---- */
  if (best.it.air) {
    if (chance(errP * 0.55)) {
      G.errs[1 - G.half]++;
      fumble(play, P);
      aimAt(BASE_POS[1][0], BASE_POS[1][1]);
      return { kind: 'error', bases: fl.dist > 62 ? 2 : 1, err: true, play,
               text: `${best.s.sn}が落球！\nエラー` };
    }
    const liner = fl.la < 24 && fl.hang < 1.7;
    const tight = best.it.t > fl.hang - 0.45;
    // an infielder just holds it; only an outfielder lobs the ball back in
    if (best.s.infield) { play.throwTo = null; play.throwDur = 0; }
    else relayIn(play, fl, P, best.pl.arm, best.i);
    return { kind: 'flyout', outs: 1, fielder: best.s, play,
      canSac: !liner && Math.hypot(P.x, P.z) > 48,
      text: liner ? `${best.s.sn}ライナー\nアウト`
        : (tight ? `${best.s.sn}が好捕！\nアウト` : `${best.s.sn}フライ\nアウト`) };
  }

  /* ---- played off the ground: race the throw to the bag ---- */
  let safeTo = 0;
  for (let n = 1; n <= 3; n++) {
    const arrives = best.it.t + throwTime(P, basePt(n - 1)[0], basePt(n - 1)[1], best.pl.arm);
    if (arrives > baseTime(bat, n) + 0.12) safeTo = n; else break;
  }
  const infield = best.s.infield;
  const outDist = Math.hypot(P.x, P.z);
  // nobody throws the batter out at first from deep in the outfield
  if (safeTo === 0 && !infield && outDist > 40) safeTo = 1;
  // once it is past the outfielders he is standing on second before the relay
  if (!infield && outDist > fenceAt(st, fl.ang) * 0.76 + 6) safeTo = Math.max(safeTo, 2);

  if (chance(errP)) {
    G.errs[1 - G.half]++;
    fumble(play, P);
    aimAt(BASE_POS[0][0], BASE_POS[0][1]);
    return { kind: 'error', bases: Math.max(1, safeTo), err: true, play,
             text: `${best.s.sn}がはじいた！\nエラー` };
  }

  if (safeTo === 0) {
    if (G.bases[0] && G.outs < 2 && infield && fl.v0 > 17
        && chance(0.34 + best.pl.defense * 0.28)) {
      // ball to the third-base side: the second baseman takes the bag and the
      // shortstop backs him up; to the first-base side it is the other way round
      const leftSide = fl.ang > 0;
      let pivotK = leftSide ? '2B' : 'SS', backK = leftSide ? 'SS' : '2B';
      if (stationIdx(pivotK) === best.i) { const t2 = pivotK; pivotK = backK; backK = t2; }
      const pivotI = stationIdx(pivotK), backI = stationIdx(backK);
      const pivotP = fielderOf(def, pivotK);
      const bag2 = BASE_POS[1], bag1 = BASE_POS[0];

      play.via = bag2;
      play.viaDur = throwTime(P, bag2[0], bag2[1], best.pl.arm);
      play.moves.push({ idx: pivotI, x: bag2[0], z: bag2[1], byT: play.cutT + play.viaDur });
      if (backI >= 0 && backI !== best.i)     // the other one converges as back-up
        play.moves.push({ idx: backI, x: bag2[0] + (leftSide ? 2.6 : -2.6), z: bag2[1] + 3.4,
                          byT: play.cutT + play.viaDur });
      play.throwTo = bag1;
      play.throwDur = throwTime({ x: bag2[0], z: bag2[1] }, bag1[0], bag1[1], pivotP.arm);
      const fbI = coverFor(bag1[0], bag1[1], best.i);
      if (fbI >= 0 && fbI !== best.i && fbI !== pivotI)
        play.moves.push({ idx: fbI, x: bag1[0], z: bag1[1],
                          byT: play.cutT + play.viaDur + play.throwDur });
      return { kind: 'dp', outs: 2, fielder: best.s, play,
               text: `${best.s.sn}→${pivotK === '2B' ? 'セカンド' : 'ショート'}→ファースト\nゲッツー！` };
    }
    if (G.bases[0] && G.outs < 2 && chance(0.22)) {
      aimAt(BASE_POS[1][0], BASE_POS[1][1]);
      return { kind: 'fc', outs: 1, fielder: best.s, play,
               text: `${best.s.sn}\nフィルダースチョイス` };
    }
    aimAt(BASE_POS[0][0], BASE_POS[0][1]);
    return { kind: 'groundout', outs: 1, fielder: best.s, play,
             text: `${best.s.sn}ゴロ\nアウト` };
  }

  /* ---- a base hit ---- */
  if (infield) {
    aimAt(BASE_POS[0][0], BASE_POS[0][1]);
  } else if (G.bases[1] || G.bases[2]) {
    aimAt(HOME_POS[0], HOME_POS[1]);        // a runner is coming round: back home
  } else if (safeTo === 2) {
    aimAt(BASE_POS[1][0], BASE_POS[1][1]);  // he is pulling into second: throw there
  } else {
    // never throw to the bag ahead of the runner from the outfield — a throw to
    // third on a triple only opens up the plate. It goes to the cut-off man.
    const d0 = Math.hypot(P.x, P.z) || 1;
    const rx = (P.x / d0) * 36, rz = (P.z / d0) * 36;
    let cutK = fl.ang > 0 ? 'SS' : '2B';
    if (stationIdx(cutK) === best.i) cutK = cutK === 'SS' ? '2B' : 'SS';
    const ci = stationIdx(cutK);
    play.throwTo = [rx, rz];
    play.throwDur = throwTime(P, rx, rz, best.pl.arm);
    if (ci >= 0 && ci !== best.i)
      play.moves.push({ idx: ci, x: rx, z: rz, byT: play.cutT + play.throwDur });
  }
  if (st.fenceH === 0 && safeTo === 3 && bat.speed > 0.72 && chance(0.22))
    return { kind: 'ihr', bases: 4, hit: true, big: true, play, text: 'ランニングホームラン！' };
  const carNote = fl.carHit ? '車に当たった！\n' : downNote;
  const text = carNote + (safeTo === 3 ? `${best.s.sn}へ\nスリーベースヒット！`
    : safeTo === 2 ? `${best.s.sn}へ\nツーベースヒット！`
    : infield ? '内野安打！'
    : outDist < 46 ? 'ポテンヒット！' : `${best.s.sn}前ヒット！`);
  return { kind: 'hit', bases: safeTo, hit: true, play, text };
}

/* ============================================================
   base running
   ============================================================ */
/* A runner follows the base paths and touches every bag on the way, so a man
   on first going to third rounds second instead of cutting the corner. */
function moveRunner(p, from, to, delay, retired) {
  const pts = [];
  for (let b = from; b <= to; b++) {
    let q = basePt(b);
    if (b === from && b >= 0 && b <= 2) {      // he was already off the bag
      const n2 = basePt(b + 1);
      const ux = n2[0] - q[0], uz = n2[1] - q[1], ul = Math.hypot(ux, uz) || 1;
      q = [q[0] + (ux / ul) * LEAD_OFF, q[1] + (uz / ul) * LEAD_OFF];
    }
    // bags he only rounds are taken a little wide, as a runner actually does
    if (b > from && b < to && b >= 0 && b <= 2) {
      const ox = q[0] - 0, oz = q[1] - 19.4, l = Math.hypot(ox, oz) || 1;
      pts.push([q[0] + (ox / l) * 1.7, q[1] + (oz / l) * 1.7]);
    } else pts.push([q[0], q[1]]);
  }
  if (pts.length < 2) pts.push(basePt(to));
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push(d); total += d;
  }
  const legs = Math.max(1, to - from);
  // the first 90 feet take exactly as long as the ruling gives him, so a throw
  // that beats him is seen to beat him; later bases are compressed a little
  const first = 27.43 / (5.6 + p.speed * 1.7);
  const rest = 27.43 / (7.6 + p.speed * 2.2);
  let dur = first * (legs === 1 ? 1 : 0.72) + (legs - 1) * rest * 0.48;
  if (legs >= 4) dur = Math.min(dur, 6.0);
  const mv = {
    p, from, to, pts, segs, total, t: -(delay || 0), dur,
    scored: to >= 3, retired: !!retired,
    rbiOwner: to >= 3 ? curBatter() : null,
  };
  G.movers.push(mv);
  return mv;
}

function scoreRun(p, batter) {
  G.score[G.half]++;
  if (batter) batter.rbi++;
}

function advanceOnHit(nb, batter) {
  let runs = 0, block = null;
  for (let i = 2; i >= 0; i--) {
    const r = G.bases[i];
    if (!r) continue;
    let adv = nb;
    if (nb < 3 && r.speed > 0.5 && chance(0.22 + r.speed * 0.34)) adv++;
    let t = i + adv;
    if (block !== null) t = Math.min(t, block - 1);
    G.bases[i] = null;
    if (t >= 3) { runs++; scoreRun(r, batter); moveRunner(r, i, 3); }
    else { G.bases[t] = r; block = t; moveRunner(r, i, t); }
  }
  let bt = nb - 1;
  if (block !== null) bt = Math.min(bt, block - 1);
  if (bt >= 3) { runs++; scoreRun(batter, batter); moveRunner(batter, -1, 3); }
  else { G.bases[bt] = batter; moveRunner(batter, -1, bt); }
  return runs;
}

function advanceOnWalk(batter) {
  let runs = 0;
  if (G.bases[0]) {
    if (G.bases[1]) {
      if (G.bases[2]) { runs++; scoreRun(G.bases[2], batter); moveRunner(G.bases[2], 2, 3); G.bases[2] = null; }
      G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2); G.bases[1] = null;
    }
    G.bases[1] = G.bases[0]; moveRunner(G.bases[0], 0, 1); G.bases[0] = null;
  }
  G.bases[0] = batter; moveRunner(batter, -1, 0);
  return runs;
}

/* How the runners finish. The batter-runner never stops on first: on a play
   in the infield he runs straight through the bag, and on a ball through to
   the outfield he takes his turn toward second and pulls up. Anyone arriving
   at a bag the ball is also arriving at goes in sliding. */
function styleBaseRunning(o) {
  const pl = o.play;
  const targets = [];
  if (pl && pl.throwTo) targets.push(pl.throwTo);
  if (pl && pl.via) targets.push(pl.via);
  for (const mv of G.movers) {
    // on a caught fly he peels off rather than running it out
    if (mv.from === -1 && mv.to === 0 && o.kind !== 'flyout') {
      const b = basePt(0);
      if (!mv.retired && pl && !pl.infield) {  // rounding, looking at second
        const n = basePt(1);
        const ux = n[0] - b[0], uz = n[1] - b[1], ul = Math.hypot(ux, uz) || 1;
        mv.over = { x: b[0] + (ux / ul) * 3.6, z: b[1] + (uz / ul) * 3.6,
                    dur: 0.62, ret: false };
      } else {                                 // straight through, then back
        const ul = Math.hypot(b[0], b[1]) || 1;      // home plate is the origin
        mv.over = { x: b[0] + (b[0] / ul) * 5.4, z: b[1] + (b[1] / ul) * 5.4,
                    dur: 0.55, ret: true };
      }
    }
    if (mv.to >= 1 && mv.to <= 3) {
      const b = basePt(mv.to);
      for (const t of targets)
        if (Math.hypot(t[0] - b[0], t[1] - b[1]) < 5.0) { mv.slide = 1; break; }
    }
  }
}

/* everyone still on base moves up one, lead runner first */
function advanceOneAll(batter, allowScore) {
  let runs = 0;
  for (let i = 2; i >= 0; i--) {
    const r = G.bases[i];
    if (!r) continue;
    G.bases[i] = null;
    if (i === 2) {
      if (allowScore) { runs++; scoreRun(r, batter); moveRunner(r, 2, 3); }
      else G.bases[2] = r;
    } else { G.bases[i + 1] = r; moveRunner(r, i, i + 1); }
  }
  return runs;
}

/* ============================================================
   applying an outcome
   ============================================================ */
function applyOutcome(o) {
  const bat = curBatter();
  let runs = 0, outsAdded = 0;
  G.movers = [];

  switch (o.kind) {
    case 'hr': case 'ihr':
      bat.ab++; bat.h++; bat.hr++; G.hits[G.half]++;
      runs = advanceOnHit(4, bat);
      o.snd = 'cheer';
      break;
    case 'hit': case 'ground_rule':
      bat.ab++; bat.h++; G.hits[G.half]++;
      runs = advanceOnHit(o.bases, bat);
      o.snd = 'good';
      break;
    case 'error':
      bat.ab++;
      runs = advanceOnHit(o.bases, bat);
      o.snd = 'bad';
      break;
    case 'flyout': {
      bat.ab++; outsAdded = 1; moveRunner(bat, -1, 0, 0, true);
      // a runner tagging up cannot leave until the ball is caught
      const held = o.play ? o.play.cutT + 0.12 : 1.2;
      if (o.canSac && G.outs < 2 && G.bases[2]) {
        runs++; scoreRun(G.bases[2], bat); moveRunner(G.bases[2], 2, 3, held); G.bases[2] = null;
        o.text = '犠牲フライ！\n1点';
      } else if (G.outs < 2 && G.bases[1] && o.canSac && chance(0.62)) {
        G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2, held); G.bases[1] = null;
      } else if (G.outs >= 2) {
        // two out — he is running on contact, and the catch ends the inning
        // anyway, so show him going rather than standing on the bag
        for (let i = 2; i >= 0; i--)
          if (G.bases[i]) moveRunner(G.bases[i], i, i + 1, 0, true);
      }
      o.snd = 'mitt';
      break;
    }
    case 'groundout':
      bat.ab++; outsAdded = 1; moveRunner(bat, -1, 0, 0, true);
      // with the play going to first, everyone else moves up
      if (chance(0.86)) runs += advanceOneAll(bat, G.outs < 2 && chance(0.85));
      o.snd = 'mitt';
      break;
    case 'fc':
      bat.ab++; outsAdded = 1;
      if (G.bases[2]) { runs++; scoreRun(G.bases[2], bat); moveRunner(G.bases[2], 2, 3); G.bases[2] = null; }
      if (G.bases[1]) { G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2); G.bases[1] = null; }
      G.bases[0] = bat; moveRunner(bat, -1, 0);
      o.snd = 'mitt';
      break;
    case 'dp': {
      bat.ab++; outsAdded = Math.min(2, 3 - G.outs);
      const forced = G.bases[0];
      G.bases[0] = null;
      moveRunner(bat, -1, 0, 0, true);
      if (forced) moveRunner(forced, 0, 1, 0, true);
      runs += advanceOneAll(bat, G.outs < 2);
      if (G.bases[1]) { G.bases[2] = G.bases[1]; moveRunner(G.bases[1], 1, 2); G.bases[1] = null; }
      o.snd = 'mitt';
      break;
    }
    case 'strikeout':
      bat.ab++; bat.k++; outsAdded = 1;
      o.snd = 'miss';
      break;
    case 'walk':
      bat.bb++;
      runs = advanceOnWalk(bat);
      break;
    case 'hbp':
      bat.hbp++;
      runs = advanceOnWalk(bat);
      // he takes a moment to shake it off before trotting down
      for (const mv of G.movers) mv.t = -0.65;
      G.hbpT = 1.05;
      o.snd = 'crash';
      logLine(`${bat.name}にデッドボール！`, true);
      break;
    case 'bunt_out':
      bat.ab++; outsAdded = 1; moveRunner(bat, -1, 0, 0, true);
      runs += advanceOneAll(bat, G.outs < 2);
      break;
  }

  styleBaseRunning(o);
  G.outs += outsAdded;
  if (runs > 0) {
    logLine(`${bat.name}の${o.kind === 'walk' ? '押し出し' : (o.text.split('\n')[0])} — ${runs}点`, true);
  }
  G.inningRuns += runs;
  // whoever got something out of the play wears it on their face until the
  // next pitch. Runs, or the batter reaching, counts as the batting side's.
  const forBat = runs > 0 || outsAdded === 0;
  G.faceBat = forBat ? EXPR.happy : EXPR.down;
  G.faceFld = forBat ? EXPR.down : EXPR.happy;
  G.lastText = o.text;
  uiScore();

  // hand the ball back to the fielders
  placeFielders();
  return runs;
}

/* ============================================================
   count handling
   ============================================================ */
function afterPitch(kind) {
  const bat = curBatter();
  G.faceBat = G.faceFld = EXPR.idle;   // finishAtBat overrides if the PA ends
  if (kind === 'hbp') {
    finishAtBat({ kind: 'hbp', text: 'デッドボール！' });
    return;
  }
  if (kind === 'ball') {
    G.balls++;
    if (G.balls >= 4) { finishAtBat({ kind: 'walk', text: 'フォアボール' }); return; }
    banner('ボール');
    uiScore(); setPhase('result', 0.70);
    return;
  }
  if (kind === 'strike' || kind === 'whiff' || kind === 'foul') {
    if (kind === 'foul' && G.strikes >= 2) { banner('ファウル'); uiScore(); setPhase('result', 0.70); return; }
    G.strikes++;
    if (G.strikes >= 3) {
      finishAtBat({ kind: 'strikeout', text: kind === 'whiff' ? '空振り三振！' : '見逃し三振！' });
      return;
    }
    banner(kind === 'whiff' ? '空振り' : kind === 'foul' ? 'ファウル' : 'ストライク');
    if (kind === 'whiff') Snd.miss();
    uiScore(); setPhase('result', 0.70);
  }
}

/* When the words should land: as the ball is booted, as it hits the mitt, as
   the throw beats him to the bag. Measured on the same clock the play script
   runs on (`G.flightT`), so it stays glued to what is on screen. */
function resultDelay(o) {
  const pl = o.play;
  if (!pl) return G.flight ? Math.min(G.flight.total * 0.72, 2.4) : 0;
  const caught = pl.cutT;
  if (o.err) return caught + (pl.air ? 0.16 : 0.26);
  if (o.kind === 'flyout') {
    // on a sacrifice fly the words belong to the run, not to the catch. The
    // mover clock and G.flightT share an origin, and `t` still holds its
    // creation value here, so `dur - t` is when he touches the plate.
    let home = 0;
    for (const mv of G.movers)
      if (mv.to === 3 && !mv.retired) home = Math.max(home, mv.dur - mv.t);
    return Math.max(caught + 0.10, home ? home + 0.06 : 0);
  }
  if (o.kind === 'groundout' || o.kind === 'dp' || o.kind === 'fc' || o.kind === 'bunt_out')
    return caught + (pl.viaDur || 0) + (pl.throwDur || 0) + 0.06;
  return caught + 0.14;                       // a base hit, as it is played
}

function flushResult() {
  const q = G.pending;
  if (!q) return;
  G.pending = null;
  banner(q.text, q.big);
  if (q.snd && Snd[q.snd]) Snd[q.snd]();
}

function finishAtBat(o) {
  applyOutcome(o);
  logLine(`${G.inning}回${G.half === 0 ? '表' : '裏'} ${curBatter().name}：${o.text.replace('\n', ' ')}`);
  G.order[G.half] = (G.order[G.half] + 1) % 9;
  if (!G.flight) G.ball.vis = false;   // a batted ball stays on screen
  const len = Math.max(1.5, playLength());
  G.pending = { text: o.text, big: o.big, snd: o.snd,
                at: Math.min(resultDelay(o), len - 0.25) };
  setPhase('play', len);
}

function playLength() {
  let m = 1.4;
  for (const mv of G.movers) if (!mv.retired) m = Math.max(m, Math.min(mv.dur - mv.t + 0.5, 6.6));
  const pl = G.playScript;
  if (pl) m = Math.max(m, pl.cutT + (pl.fumble ? FUMBLE_T + 0.45 : 0)
                          + (pl.viaDur || 0) + (pl.via ? 0.28 : 0)
                          + (pl.throwDur || 0) + 0.7);
  else if (G.flight) m = Math.max(m, Math.min(G.flight.total, 5.0) + 0.8);
  return m;
}

/* ============================================================
   innings
   ============================================================ */
function endHalfInning() {
  let onBase = 0;
  for (const b of G.bases) if (b) onBase++;
  G.lob[G.half] += onBase;
  recordInningRuns(G.half, G.inning, G.inningRuns);
  G.inningRuns = 0;
  G.bases = [null, null, null];
  G.outs = 0;
  G.movers = [];
  logLine(`${G.inning}回${G.half === 0 ? '表' : '裏'}おわり — ${G.away.name} ${G.score[0]} : ${G.score[1]} ${G.home.name}`, true);

  if (G.half === 0) {
    G.half = 1;
    // home team leads after the top of the 9th or later: no need to bat
    if (G.inning >= G.innings && G.score[1] > G.score[0]) { endGame(); return; }
  } else {
    G.half = 0; G.inning++;
    if (G.inning > G.innings && G.score[0] !== G.score[1]) { endGame(); return; }
    if (G.inning > G.innings + 3) { endGame(); return; }   // three extra, then a tie
  }
  uiScore();
  banner(`${G.inning}回${G.half === 0 ? '表' : 'ウラ'}`);
  setPhase('halfend', 1.6);
}

function inningLine(half, inn) {
  while (G.lines[half].length < inn) G.lines[half].push(null);
}

function recordInningRuns(half, inn, runs) {
  inningLine(half, inn);
  G.lines[half][inn - 1] = (G.lines[half][inn - 1] || 0) + runs;
}

function endGame() {
  if (G.inningRuns > 0) { recordInningRuns(G.half, G.inning, G.inningRuns); G.inningRuns = 0; }
  G.over = true; G.active = false;
  setPhase('gameover', 0);
  showResult();
}

/* walk-off check after runs score in the bottom half */
function checkWalkoff() {
  if (G.half === 1 && G.inning >= G.innings && G.score[1] > G.score[0]) {
    logLine('サヨナラ！', true);
    banner('サヨナラ！', true);
    Snd.cheer();
    setPhase('walkoff', 2.1);
    return true;
  }
  return false;
}

/* ============================================================
   card art — 2D sketches so the menus show what you are picking
   ============================================================ */
function faceCanvas(team, w, h) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  const A = ANIMALS[team.animal];
  g.fillStyle = '#20303F'; g.fillRect(0, 0, w, h);
  // pennant stripes behind the face
  g.fillStyle = team.uni;
  for (let i = -2; i < 10; i++) { g.beginPath(); g.moveTo(i * 22, h); g.lineTo(i * 22 + 26, 0); g.lineTo(i * 22 + 38, 0); g.lineTo(i * 22 + 12, h); g.fill(); }
  g.globalAlpha = 0.22; g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.globalAlpha = 1;

  const cx = w / 2, cy = h * 0.60, r = h * 0.34;
  const ear = (dx, dy, rr) => { g.beginPath(); g.arc(cx + dx, cy + dy, rr, 0, 7); g.fill(); };
  g.fillStyle = A.fur;
  if (A.ear === 'round') { ear(-r * 0.82, -r * 0.72, r * 0.36); ear(r * 0.82, -r * 0.72, r * 0.36); }
  if (A.ear === 'point') {
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(cx + s * r * 0.3, cy - r * 0.8); g.lineTo(cx + s * r * 0.95, cy - r * 1.35); g.lineTo(cx + s * r * 1.0, cy - r * 0.5); g.fill(); }
  }
  if (A.ear === 'toad') { ear(-r * 0.72, -r * 0.66, r * 0.34); ear(r * 0.72, -r * 0.66, r * 0.34); }
  g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  // cap
  g.fillStyle = team.cap;
  g.beginPath(); g.arc(cx, cy - r * 0.16, r * 1.0, Math.PI, 0); g.fill();
  g.fillRect(cx - r * 1.05, cy - r * 0.2, r * 2.1, r * 0.16);
  g.beginPath(); g.ellipse(cx, cy - r * 0.16, r * 1.25, r * 0.2, 0, Math.PI, 0); g.fill();
  g.fillStyle = team.trim; g.beginPath(); g.arc(cx, cy - r * 1.1, r * 0.12, 0, 7); g.fill();
  // long ears sit on top of the cap, not under it
  if (A.ear === 'long') {
    for (const s of [-1, 1]) {
      g.save(); g.translate(cx + s * r * 0.46, cy - r * 1.16); g.rotate(s * 0.26);
      g.fillStyle = A.fur; g.beginPath(); g.ellipse(0, 0, r * 0.23, r * 0.66, 0, 0, 7); g.fill();
      g.fillStyle = A.fur2; g.beginPath(); g.ellipse(0, r * 0.06, r * 0.11, r * 0.44, 0, 0, 7); g.fill();
      g.restore();
    }
  }
  // muzzle + eyes
  g.fillStyle = A.fur2;
  g.beginPath(); g.ellipse(cx, cy + r * 0.36, r * 0.44, r * 0.32, 0, 0, 7); g.fill();
  if (A.beak) {
    g.fillStyle = A.beak;
    g.beginPath(); g.moveTo(cx - r * 0.20, cy + r * 0.26); g.lineTo(cx + r * 0.20, cy + r * 0.26);
    g.lineTo(cx, cy + r * 0.66); g.closePath(); g.fill();
  }
  g.fillStyle = '#22282F';
  if (A.ear === 'toad') { g.fillStyle = A.fur; ear(-r * 0.72, -r * 0.66, r * 0.34); ear(r * 0.72, -r * 0.66, r * 0.34); g.fillStyle = '#22282F'; ear(-r * 0.72, -r * 0.72, r * 0.15); ear(r * 0.72, -r * 0.72, r * 0.15); }
  g.beginPath(); g.ellipse(cx - r * 0.34, cy + r * 0.02, r * 0.11, r * 0.14, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(cx + r * 0.34, cy + r * 0.02, r * 0.11, r * 0.14, 0, 0, 7); g.fill();
  if (!A.beak) { g.beginPath(); g.ellipse(cx, cy + r * 0.26, r * 0.13, r * 0.10, 0, 0, 7); g.fill(); }
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(cx - r * 0.30, cy - r * 0.04, r * 0.045, 0, 7); g.fill();
  g.beginPath(); g.arc(cx + r * 0.38, cy - r * 0.04, r * 0.045, 0, 7); g.fill();
  if (A.brow) {                      // the drawn brow line, as on the model
    g.strokeStyle = '#3A2A1A'; g.lineWidth = r * 0.11; g.lineCap = 'round';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(cx + s * r * 0.16, cy - r * 0.30);
      g.lineTo(cx + s * r * 0.52, cy - r * 0.24);
      g.stroke();
    }
  }
  return c;
}

function parkCanvas(st, w, h) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  const [a, b, sky] = st.cardColors;
  const horizon = h * 0.52;
  g.fillStyle = sky; g.fillRect(0, 0, w, horizon);
  g.fillStyle = a; g.fillRect(0, horizon, w, h - horizon);
  const rect = (x, y, ww, hh, f) => { g.fillStyle = f; g.fillRect(x, y, ww, hh); };
  if (st.id === 'dome') {
    rect(0, horizon - 12, w, 12, '#2F6C57');
    for (let i = 0; i < 5; i++) rect(6 + i * 26, horizon - 30, 4, 30, '#5A6A78');
    g.fillStyle = b; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2 - 46, horizon + 4); g.lineTo(w / 2 + 46, horizon + 4); g.fill();
    g.fillStyle = '#F4EFE2'; g.beginPath(); g.arc(w / 2, h - 8, 4, 0, 7); g.fill();
  }
  if (st.id === 'road') {
    for (let i = 0; i < 4; i++) { rect(2 + i * 16, horizon - 34 - i * 4, 13, 34 + i * 4, i % 2 ? '#8C7F72' : '#7A8A93'); rect(w - 15 - i * 16, horizon - 30 - i * 5, 13, 30 + i * 5, i % 2 ? '#9A8577' : '#6F7C86'); }
    rect(w / 2 - 34, horizon - 16, 68, 16, '#7E8489');
    for (let i = 0; i < 4; i++) rect(w / 2 - 2, horizon + 6 + i * 12, 4, 7, b);
    rect(w / 2 - 26, h - 16, 16, 9, '#D9483B'); rect(w / 2 + 12, h - 20, 16, 9, '#3E6FBF');
  }
  if (st.id === 'market') {
    rect(0, 0, w, 14, '#C4C7BE');
    for (let i = 0; i < 5; i++) rect(8 + i * 24, 4, 16, 4, '#FFF8DC');
    for (let i = 0; i < 4; i++) { rect(10 + i * 30, horizon - 22, 22, 22, '#9EA6A2'); for (let j = 0; j < 3; j++) rect(12 + i * 30, horizon - 20 + j * 7, 18, 4, [b, '#F2C14E', '#7FB3D5'][j]); }
    for (let x = 0; x < w; x += 14) for (let y = horizon; y < h; y += 14) rect(x, y, 13, 13, ((x + y) / 14) % 2 ? '#DCDDD4' : '#D0D2C8');
  }
  if (st.id === 'river') {
    rect(0, horizon - 10, w, 10, '#6FA8C4');
    for (let i = 0; i < 6; i++) { g.fillStyle = '#5E8A3E'; g.beginPath(); g.arc(10 + i * 34, horizon - 12, 9, 0, 7); g.fill(); g.fillStyle = '#6B4A32'; g.fillRect(9 + i * 34, horizon - 12, 3, 12); }
    g.fillStyle = b; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2 - 40, horizon + 6); g.lineTo(w / 2 + 40, horizon + 6); g.fill();
  }
  if (st.id === 'moon') {
    g.fillStyle = '#E8EEFA';
    for (let i = 0; i < 40; i++) { const x = Math.random() * w, y = Math.random() * horizon; g.fillRect(x, y, 1.5, 1.5); }
    g.fillStyle = '#3E6FA8'; g.beginPath(); g.arc(w * 0.78, horizon * 0.42, 16, 0, 7); g.fill();
    g.fillStyle = '#5E9A5E'; g.beginPath(); g.arc(w * 0.74, horizon * 0.36, 6, 0, 7); g.fill();
    g.fillStyle = '#6E6E76';
    for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(Math.random() * w, horizon + 8 + Math.random() * (h - horizon - 8), 8 + Math.random() * 12, 4, 0, 0, 7); g.fill(); }
  }
  return c;
}

function uiHint() {
  // in a two-player game the controls hand over at the release; against the
  // computer the side you are on does not change mid-pitch
  const pitching = G.mode === 'vs' ? (G.phase === 'aim' || G.phase === 'ready') : !userBatting();
  const touch = matchMedia('(pointer:coarse)').matches;
  const who = G.mode === 'vs' ? (pitching ? `${pitchingPlayer()} ` : `${battingPlayer()} `) : '';
  const keys = !pitching
    ? (touch ? [['ドラッグ', 'ねらう'], ['タップ', 'スイング']]
             : [['矢印 / マウス', 'ねらう'], ['SPACE', 'スイング'], ['SHIFT+SPACE', 'バント']])

             : [['1〜5', '球種'], ['矢印 / マウス', 'コース'], ['SPACE', '投げる']]);
  $('#hint').innerHTML = (who ? `<span class="key act"><kbd>${who.trim()}</kbd>${pitching ? 'が投げる' : 'が打つ'}</span>` : '')
